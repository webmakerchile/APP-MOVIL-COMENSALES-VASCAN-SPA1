<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vale de Comedor – BuenaMezcla</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #e5e7eb;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 40px 20px;
    font-family: Arial, sans-serif;
    gap: 20px;
  }
  h1 { font-size: 13px; color: #6b7280; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
  .ticket {
    width: 302px;
    background: #fff;
    padding: 15px 15px 30px 15px;
    font-family: "Courier New", "Courier", monospace;
    font-size: 12px;
    line-height: 1.5;
    color: #000;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    position: relative;
    border-radius: 2px;
  }
  .ticket::after {
    content: "";
    position: absolute;
    bottom: -1px; left: -1px; right: -1px;
    height: 14px;
    background: radial-gradient(circle at 50% 0%, #e5e7eb 10px, transparent 10px);
    background-size: 20px 14px;
    background-repeat: repeat-x;
  }
  .t-center   { text-align: center; }
  .t-title    { font-size: 14px; font-weight: 800; letter-spacing: 3px; text-align: center; }
  .t-sub      { font-size: 11px; text-align: center; margin: 1px 0; }
  .t-hr       { border: none; border-top: 1px dashed #000; margin: 8px 0; }
  .t-familia  { font-size: 13px; font-weight: 800; text-align: center; letter-spacing: 2px; margin: 4px 0 2px; }
  .t-opcion   {
    font-size: 13px; font-weight: 800; text-align: center;
    margin: 4px 0 8px;
    padding: 5px 6px;
    border: 2px solid #000;
    line-height: 1.35;
  }
  .t-row      { display: flex; justify-content: space-between; font-size: 11px; margin: 2px 0; }
  .t-label    { font-weight: 400; }
  .t-value    { font-weight: 700; text-align: right; }
  .t-foot     { text-align: center; font-size: 10px; margin-top: 8px; color: #444; }
</style>
</head>
<body>

<h1>Vale de comedor – impresión tótem (80 mm)</h1>

<div class="ticket">
  <div class="t-title">&gt;&gt; CASINO &lt;&lt;</div>
  <div class="t-sub">Casino Unión Química</div>
  <div class="t-sub">VALE DE COMEDOR</div>
  <hr class="t-hr">
  <div class="t-familia">ALMUERZO</div>
  <div class="t-opcion">OPCIÓN 1<br>Pollo al horno con arroz<br>y ensalada</div>
  <hr class="t-hr">
  <div class="t-row">
    <span class="t-label">Nombre</span>
    <span class="t-value">JuanCarlos Pérez</span>
  </div>
  <div class="t-row">
    <span class="t-label">RUT</span>
    <span class="t-value">12.345.678-9</span>
  </div>
  <div class="t-row">
    <span class="t-label">Fecha</span>
    <span class="t-value">26/05/2026</span>
  </div>
  <div class="t-row">
    <span class="t-label">Hora</span>
    <span class="t-value">19:08</span>
  </div>
  <hr class="t-hr">
  <div class="t-foot">BuenaMezcla · Vale no reimprimible</div>
</div>

</body>
</html>
