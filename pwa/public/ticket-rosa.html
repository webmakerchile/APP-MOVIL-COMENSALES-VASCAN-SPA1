<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Vale Rosa</title>
<style>
  html, body { margin:0; padding:0; background:#cccccc; font-family: "Courier New", monospace; }
  .page { padding: 40px; display:flex; justify-content:center; }
  .ticket {
    width: 302px; /* ~80mm @ 96dpi */
    background: #ffffff;
    color: #000;
    padding: 18px 16px 22px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.25);
    border-radius: 2px;
    background-image:
      linear-gradient(135deg, transparent 49%, #fff 49% 51%, transparent 51%),
      linear-gradient(45deg, transparent 49%, #fff 49% 51%, transparent 51%);
    position: relative;
  }
  .ticket::after {
    content:"";
    position:absolute; left:0; right:0; bottom:-10px; height:14px;
    background:
      radial-gradient(circle at 7px 0, #cccccc 6px, transparent 6.5px) repeat-x;
    background-size: 14px 14px;
  }
  .pv-title   { font-size: 13px; font-weight: 800; letter-spacing: 3px; text-align: center; }
  .pv-sub     { font-size: 11px; text-align: center; margin: 2px 0; }
  .pv-hr      { border: 0; border-top: 1px dashed #000; margin: 9px 0; }
  .pv-familia { font-size: 13px; font-weight: 800; text-align: center; letter-spacing: 2px; margin: 4px 0 2px; text-transform: uppercase; }
  .pv-opcion  { font-size: 12px; text-align: center; line-height: 1.25; padding: 0 4px; }
  .pv-row     { display: flex; justify-content: space-between; gap: 8px; margin: 3px 0; font-size: 11px; }
  .pv-label   { font-weight: 400; }
  .pv-value   { text-align: right; font-weight: 700; }
  .pv-foot    { text-align: center; font-size: 10px; margin-top: 8px; color: #444; }
</style>
</head>
<body>
  <div class="page">
    <div class="ticket">
      <div class="pv-title">&gt;&gt; CASINO &lt;&lt;</div>
      <div class="pv-sub">CASINO UNION QUIMICA</div>
      <div class="pv-sub">VALE DE COMEDOR</div>
      <hr class="pv-hr" />
      <div class="pv-familia">COLACION GENERAL</div>
      <div class="pv-opcion">Albondigas en Salsa con Espirales Tricolor</div>
      <hr class="pv-hr" />
      <div class="pv-row"><span class="pv-label">Nombre</span><span class="pv-value">Rosa Maria Quillas Almonacid</span></div>
      <div class="pv-row"><span class="pv-label">RUT</span><span class="pv-value">22293362-5</span></div>
      <div class="pv-row"><span class="pv-label">Fecha</span><span class="pv-value">27/05/2026</span></div>
      <div class="pv-row"><span class="pv-label">Hora</span><span class="pv-value">00:23</span></div>
      <hr class="pv-hr" />
      <div class="pv-foot">BuenaMezcla · Vale no reimprimible</div>
    </div>
  </div>
</body>
</html>
