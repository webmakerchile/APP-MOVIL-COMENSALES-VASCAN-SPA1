                              </td>
                              <td className="px-4 py-2 font-mono text-xs text-white/60 whitespace-nowrap">{r.fechaServicio}</td>
                              <td className="px-4 py-2">{tipoBadge}</td>
                              <td className="px-4 py-2">{origenBadge}</td>
                              <td className="px-4 py-2 text-right">
                                <button
                                  onClick={() => setConfirmDelete(r)}
                                  className="px-2.5 py-1 bg-red-500/15 hover:bg-red-500/25 border border-red-500/30 text-red-300 hover:text-red-200 text-[11px] font-semibold rounded-md transition inline-flex items-center gap-1"
                                  title="Anular pedido y permitir nueva inscripción"
                                >
                                  <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M4 4l16 16M20 4L4 20" /></svg>
                                  Anular
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                    </tbody>
                  </table>
                )}
              </div>
            )}
          </div>

          {/* Modal de confirmación de anulación */}
          {confirmDelete && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50 fade-in" onClick={() => !deleting && setConfirmDelete(null)}>
              <div className="bg-vascan-surface border border-white/10 rounded-2xl max-w-md w-full p-6 shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="flex items-start gap-4 mb-4">
                  <div className="w-12 h-12 rounded-full bg-red-500/15 border border-red-500/30 flex items-center justify-center flex-shrink-0">
                    <svg className="w-6 h-6 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                  </div>
                  <div className="flex-1">
                    <h3 className="text-lg font-bold text-white">¿Anular este pedido?</h3>
                    <p className="text-sm text-white/60 mt-1">El comensal podrá inscribirse nuevamente en esta minuta.</p>
                  </div>
                </div>

                <div className="bg-white/5 border border-white/10 rounded-xl p-3 mb-5 space-y-1.5 text-sm">
                  <div className="flex justify-between gap-2"><span className="text-white/50">Comensal</span><span className="text-white font-medium text-right">{confirmDelete.comensal}</span></div>
                  {confirmDelete.rut && <div className="flex justify-between gap-2"><span className="text-white/50">RUT</span><span className="text-white/80 font-mono text-xs text-right">{confirmDelete.rut}</span></div>}
                  <div className="flex justify-between gap-2"><span className="text-white/50">Casino</span><span className="text-white/80 text-right text-xs">{confirmDelete.casino}</span></div>
                  <div className="flex justify-between gap-2"><span className="text-white/50">Día servicio</span><span className="text-white/80 font-mono text-xs">{confirmDelete.fechaServicio}</span></div>
                  <div className="flex justify-between gap-2"><span className="text-white/50">Opción</span><span className="text-white/90 text-right text-xs"><span className="text-vascan-gold font-bold mr-1">#{confirmDelete.opcionNumero}</span>{confirmDelete.opcionTexto}</span></div>
                  <div className="flex justify-between gap-2"><span className="text-white/50">Hora vale</span><span className="text-white/70 font-mono text-xs">{confirmDelete.createdAt ? new Date(confirmDelete.createdAt).toLocaleString('es-CL') : '—'}</span></div>
                  {confirmDelete.codigoQr && <div className="flex justify-between gap-2"><span className="text-white/50">QR</span><span className="text-white/40 font-mono text-[10px] truncate">{confirmDelete.codigoQr}</span></div>}
                </div>

                <p className="text-xs text-orange-300/80 mb-5 flex items-start gap-2">
                  <svg className="w-3.5 h-3.5 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  El vale anterior queda anulado. Si ya estaba impreso, el comensal debe descartarlo y volver a registrarse desde la app o el tótem.
                </p>

                <div className="flex gap-2">
                  <button
                    onClick={() => setConfirmDelete(null)}
                    disabled={deleting}
                    className="flex-1 px-4 py-2.5 bg-white/5 hover:bg-white/10 border border-white/10 text-white/80 font-semibold rounded-xl transition disabled:opacity-50 text-sm"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={handleDeletePedido}
                    disabled={deleting}
                    className="flex-1 px-4 py-2.5 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-xl transition disabled:opacity-50 text-sm flex items-center justify-center gap-2"
                  >
                    {deleting && <svg className="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" strokeDasharray="40" strokeLinecap="round"/></svg>}
                    {deleting ? 'Anulando…' : 'Sí, anular'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {weekReport && (
            <div className="bg-vascan-surface rounded-2xl border border-white/10 overflow-hidden mt-6 fade-in">
              <div className="p-5 border-b border-white/10 flex items-center justify-between">
                <div>
                  <h2 className="font-semibold text-lg">Programación Semanal</h2>
                  <p className="text-white/50 text-sm mt-0.5">{weekReport.casinoNombre} — Semana {weekReport.weekStart} al {weekReport.weekEnd} — {weekReport.totalComensales} comensales</p>
                </div>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="border-b border-white/10 text-white/50">
                      <th className="text-left px-4 py-3">Opción</th>
                      {weekReport.dias.map(d => (
                        <th key={d.fecha} className="text-center px-4 py-3">{d.dia}<br/><span className="text-[10px] font-normal">{d.fecha.slice(5)}</span></th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {(() => {
                      const maxOpts = Math.max(...weekReport.dias.map(d => d.opciones.length));
                      const rows = [];
                      for (let i = 0; i < maxOpts; i++) {
                        rows.push(
                          <tr key={`desc-${i}`} className="border-b border-white/5">
                            <td className="px-4 py-2 font-medium text-vascan-gold text-xs">OP{i+1}</td>
                            {weekReport.dias.map(d => (
                              <td key={d.fecha} className="px-4 py-2 text-center text-[11px] text-white/60 max-w-[120px] truncate" title={d.opciones[i]?.descripcion || ''}>{d.opciones[i]?.descripcion || '—'}</td>
                            ))}
                          </tr>
                        );
                      }
                      rows.push(
                        <tr key="spacer" className="h-2"></tr>
                      );
                      for (let i = 0; i < maxOpts; i++) {
                        rows.push(
                          <tr key={`count-${i}`} className="border-b border-white/5">
                            <td className="px-4 py-2 text-white/70">Opción {i+1}</td>
                            {weekReport.dias.map(d => (
                              <td key={d.fecha} className="px-4 py-2 text-center font-semibold">{d.opciones[i]?.cantidad || 0}</td>
                            ))}
                          </tr>
                        );
                      }
                      rows.push(
                        <tr key="total" className="border-t border-white/20 bg-green-500/5">
                          <td className="px-4 py-3 font-bold text-green-400">TOTAL</td>
                          {weekReport.dias.map(d => (
                            <td key={d.fecha} className="px-4 py-3 text-center font-bold text-green-400 text-lg">{d.total}</td>
                          ))}
                        </tr>,
                        <tr key="noasiste" className="bg-yellow-500/5">
                          <td className="px-4 py-2 text-yellow-400 text-xs">No asisten</td>
                          {weekReport.dias.map(d => (
                            <td key={d.fecha} className="px-4 py-2 text-center text-yellow-400">{d.noAsiste}</td>
                          ))}
                        </tr>,
                        <tr key="noinsc" className="bg-red-500/5">
                          <td className="px-4 py-2 text-red-400 text-xs">No inscritos</td>
                          {weekReport.dias.map(d => (
                            <td key={d.fecha} className="px-4 py-2 text-center text-red-400">{d.noInscritos}</td>
                          ))}
                        </tr>
                      );
                      return rows;
                    })()}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── Familias CRUD ──
    function FamiliasView() {
      const [famList, setFamList] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState({ nombre: '', color: '#D4A843' });
      const [toast, setToast] = useState(null);

      useEffect(() => {
        apiFetch('/api/familias').then(data => { setFamList(data); setLoading(false); });
      }, []);
      useEffect(() => { if (toast) { const t = setTimeout(() => setToast(null), 3000); return () => clearTimeout(t); } }, [toast]);

      function refresh() { apiFetch('/api/familias').then(data => setFamList(data)); }

      function openCreate() { setEditing(null); setForm({ nombre: '', color: '#D4A843' }); setShowModal(true); }
      function openEdit(f) { setEditing(f); setForm({ nombre: f.nombre, color: f.color }); setShowModal(true); }

      async function handleSave() {
        if (!form.nombre) { setToast({ message: 'El nombre es obligatorio', type: 'error' }); return; }
        try {
          if (editing) {
            await apiFetch(`/api/familias/${editing.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(form) });
            setToast({ message: 'Familia actualizada', type: 'success' });
          } else {
            await apiFetch('/api/familias', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(form) });
            setToast({ message: 'Familia creada', type: 'success' });
          }
          setShowModal(false); refresh();
        } catch (e) {
          setToast({ message: e.message || 'Error al guardar', type: 'error' });
        }
      }

      async function toggleActivo(f) {
        try {
          await apiFetch(`/api/familias/${f.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ activo: !f.activo }) });
          setToast({ message: f.activo ? 'Familia desactivada' : 'Familia activada', type: 'success' }); refresh();
        } catch (e) { setToast({ message: 'Error', type: 'error' }); }
      }

      if (loading) return <LoadingSpinner />;

      return (
        <div>
          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
          <div className="flex justify-between items-center mb-6">
            <div>
              <h1 className="text-2xl font-bold text-white">Familias de Minutas</h1>
              <p className="text-white/50 text-sm mt-1">Categorías personalizadas para las minutas (Ej: Almuerzo, VIP, Ejecutivo)</p>
            </div>
            <button onClick={openCreate} className="bg-vascan-gold text-vascan-dark px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-vascan-gold/90 transition flex items-center gap-2">
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4"/></svg>
              Nueva Familia
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {famList.map(f => (
              <div key={f.id} className={`bg-vascan-surface border rounded-xl p-5 ${f.activo ? 'border-white/10' : 'border-red-500/20 opacity-60'}`}>
                <div className="flex justify-between items-center">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 rounded-full" style={{ backgroundColor: f.color }}></div>
                    <div>
                      <h3 className="font-semibold text-white">{f.nombre}</h3>
                      <p className="text-xs text-white/40">{f.activo ? 'Activa' : 'Inactiva'}</p>
                    </div>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => toggleActivo(f)} className={`p-2 rounded-lg transition ${f.activo ? 'text-green-400 hover:bg-green-500/10' : 'text-red-400 hover:bg-red-500/10'}`}>
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d={f.activo ? 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' : 'M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z'}/></svg>
                    </button>
                    <button onClick={() => openEdit(f)} className="p-2 text-white/40 hover:text-white hover:bg-white/5 rounded-lg transition">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                    </button>
                  </div>
                </div>
              </div>
            ))}
          </div>

          {showModal && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
              <div className="bg-vascan-surface border border-white/10 rounded-2xl w-full max-w-md p-6">
                <h2 className="text-xl font-bold text-white mb-5">{editing ? 'Editar Familia' : 'Nueva Familia'}</h2>
                <div className="space-y-4">
                  <InputField label="Nombre" value={form.nombre} onChange={v => setForm({...form, nombre: v})} placeholder="Ej: VIP, Almuerzo Ejecutivo" required />
                  <div>
                    <label className="block text-sm font-medium text-white/70 mb-1.5">Color</label>
                    <div className="flex items-center gap-3">
                      <input type="color" value={form.color} onChange={e => setForm({...form, color: e.target.value})} className="w-12 h-10 rounded-lg border border-white/10 cursor-pointer" />
                      <span className="text-white/50 text-sm">{form.color}</span>
                    </div>
                  </div>
                </div>
                <div className="flex gap-3 mt-6">
                  <button onClick={() => setShowModal(false)} className="flex-1 px-5 py-2.5 rounded-xl text-sm font-medium text-white/60 hover:text-white border border-white/10 hover:bg-white/5 transition">Cancelar</button>
                  <button onClick={handleSave} className="flex-1 bg-vascan-gold text-vascan-dark px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-vascan-gold/90 transition">{editing ? 'Guardar' : 'Crear'}</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── Periodos (Horarios de inscripción) ──
    function PeriodosView({ user }) {
      const [periodos, setPeriodos] = useState([]);
      const [casinos, setCasinos] = useState([]);
      const [selectedCasino, setSelectedCasino] = useState('');
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState({ nombre: '', casinoId: '', casinoIds: [], fechaInicio: '', fechaFin: '', fechaServicioInicio: '', fechaServicioFin: '' });
      const [toast, setToast] = useState(null);

      useEffect(() => {
        Promise.all([
          apiFetch('/api/periodos'),
          apiFetch('/api/casinos/all')
        ]).then(([p, c]) => {
          setPeriodos(p);
          setCasinos(c);
        }).finally(() => setLoading(false));
      }, []);

      useEffect(() => { if (toast) { const t = setTimeout(() => setToast(null), 3000); return () => clearTimeout(t); } }, [toast]);

      function refresh() {
        apiFetch('/api/periodos').then(p => setPeriodos(p));
      }

      function openCreate() {
        setEditing(null);
        setForm({ nombre: '', casinoId: '', casinoIds: casinos.map(c => c.id), fechaInicio: '', fechaFin: '', fechaServicioInicio: '', fechaServicioFin: '' });
        setShowModal(true);
      }

      function openEdit(p) {
        setEditing(p);
        const fi = new Date(p.fechaInicio);
        const ff = new Date(p.fechaFin);
        const toLocal = d => {
          const pad = n => String(n).padStart(2, '0');
          return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        };
        setForm({ nombre: p.nombre, casinoId: p.casinoId, casinoIds: [p.casinoId], fechaInicio: toLocal(fi), fechaFin: toLocal(ff), fechaServicioInicio: p.fechaServicioInicio || '', fechaServicioFin: p.fechaServicioFin || '' });
        setShowModal(true);
      }

      function toggleCasinoInPeriodo(id) {
        setForm(f => ({ ...f, casinoIds: f.casinoIds.includes(id) ? f.casinoIds.filter(x => x !== id) : [...f.casinoIds, id] }));
      }

      async function handleSave() {
        if (!form.nombre || !form.fechaInicio || !form.fechaFin) {
          setToast({ message: 'Nombre y fechas son obligatorios', type: 'error' }); return;
        }
        // Convertir el valor del input datetime-local (sin TZ) a ISO con TZ
        // explícita del navegador. Sin esto el server (UTC) interpreta la
        // hora como UTC y al volver a renderizarla en hora local de Chile
        // aparece desplazada (caso reportado: "16:51" se muestra como "04:52 a.m.").
        const fechaInicioISO = new Date(form.fechaInicio).toISOString();
        const fechaFinISO = new Date(form.fechaFin).toISOString();
        try {
          if (editing) {
            await apiFetch(`/api/periodos/${editing.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre: form.nombre, fechaInicio: fechaInicioISO, fechaFin: fechaFinISO, fechaServicioInicio: form.fechaServicioInicio || null, fechaServicioFin: form.fechaServicioFin || null }) });
            setToast({ message: 'Periodo actualizado', type: 'success' });
            setShowModal(false); refresh();
          } else {
            if (form.casinoIds.length === 0) {
              setToast({ message: 'Seleccione al menos un casino', type: 'error' }); return;
            }
            for (const cId of form.casinoIds) {
              await apiFetch('/api/periodos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre: form.nombre, casinoId: cId, fechaInicio: fechaInicioISO, fechaFin: fechaFinISO, fechaServicioInicio: form.fechaServicioInicio || null, fechaServicioFin: form.fechaServicioFin || null }) });
            }
            setToast({ message: `Periodo creado en ${form.casinoIds.length} casino(s)`, type: 'success' });
            setShowModal(false); refresh();
          }
        } catch (e) {
          setToast({ message: e.message || 'Error al guardar', type: 'error' });
        }
      }

      async function toggleActivo(p) {
        try {
          await apiFetch(`/api/periodos/${p.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ activo: !p.activo }) });
          setToast({ message: p.activo ? 'Periodo desactivado' : 'Periodo activado', type: 'success' }); refresh();
        } catch (e) {
          setToast({ message: 'Error al cambiar estado', type: 'error' });
        }
      }

      async function handleDelete(p) {
        if (!confirm('¿Desactivar este periodo?')) return;
        try {
          await apiFetch(`/api/periodos/${p.id}`, { method: 'DELETE' });
          setToast({ message: 'Periodo desactivado', type: 'success' }); refresh();
        } catch (e) {
          setToast({ message: 'Error al eliminar', type: 'error' });
        }
      }

      const filtered = selectedCasino ? periodos.filter(p => p.casinoId === selectedCasino) : periodos;
      const getCasinoName = id => casinos.find(c => c.id === id)?.nombre || 'N/A';
      const isActive = p => {
        if (!p.activo) return false;
        const now = new Date();
        return new Date(p.fechaInicio) <= now && new Date(p.fechaFin) >= now;
      };

      if (loading) return <LoadingSpinner />;

      return (
        <div>
          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
          <div className="flex justify-between items-center mb-6">
            <div>
              <h1 className="text-2xl font-bold text-white">Periodos de Inscripción</h1>
              <p className="text-white/50 text-sm mt-1">Horarios en que los comensales pueden inscribirse a las minutas</p>
            </div>
            <button onClick={openCreate} className="bg-vascan-gold text-vascan-dark px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-vascan-gold/90 transition flex items-center gap-2">
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4"/></svg>
              Nuevo Periodo
            </button>
          </div>

          {casinos.length > 0 && (
            <div className="mb-4">
              <select value={selectedCasino} onChange={e => setSelectedCasino(e.target.value)}
                className="bg-vascan-dark border border-white/10 text-white rounded-xl px-4 py-2.5 text-sm appearance-none cursor-pointer" style={{colorScheme: 'dark'}}>
                <option value="">Todos los casinos</option>
                {casinos.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
              </select>
            </div>
          )}

          {filtered.length === 0 ? (
            <div className="text-center py-16 text-white/40">
              <svg className="w-16 h-16 mx-auto mb-4 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <p className="text-lg font-medium">Sin periodos configurados</p>
              <p className="text-sm mt-1">Crea un periodo para definir cuándo los comensales pueden inscribirse</p>
            </div>
          ) : (
            <div className="grid gap-4">
              {filtered.map(p => {
                const active = isActive(p);
                const fi = new Date(p.fechaInicio);
                const ff = new Date(p.fechaFin);
                const fmt = d => d.toLocaleString('es-CL', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                return (
                  <div key={p.id} className={`bg-vascan-surface border rounded-xl p-5 ${active ? 'border-green-500/40' : p.activo ? 'border-white/10' : 'border-red-500/20 opacity-60'}`}>
                    <div className="flex justify-between items-start">
                      <div className="flex-1">
                        <div className="flex items-center gap-3 mb-2">
                          <h3 className="font-semibold text-white text-lg">{p.nombre}</h3>
                          {active && <span className="px-2 py-0.5 bg-green-500/20 text-green-400 text-xs font-medium rounded-full animate-pulse">EN CURSO</span>}
                          {!p.activo && <span className="px-2 py-0.5 bg-red-500/20 text-red-400 text-xs font-medium rounded-full">INACTIVO</span>}
                          {p.activo && !active && new Date(p.fechaFin) < new Date() && <span className="px-2 py-0.5 bg-gray-500/20 text-gray-400 text-xs font-medium rounded-full">FINALIZADO</span>}
                          {p.activo && !active && new Date(p.fechaInicio) > new Date() && <span className="px-2 py-0.5 bg-blue-500/20 text-blue-400 text-xs font-medium rounded-full">PROGRAMADO</span>}
                        </div>
                        <p className="text-white/50 text-sm">{getCasinoName(p.casinoId)}</p>
                        <div className="flex gap-6 mt-3 text-sm">
                          <div>
                            <span className="text-white/40">Inicio: </span>
                            <span className="text-white/80">{fmt(fi)}</span>
                          </div>
                          <div>
                            <span className="text-white/40">Fin: </span>
                            <span className="text-white/80">{fmt(ff)}</span>
                          </div>
                        </div>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => toggleActivo(p)} className={`p-2 rounded-lg transition ${p.activo ? 'text-green-400 hover:bg-green-500/10' : 'text-red-400 hover:bg-red-500/10'}`} title={p.activo ? 'Desactivar' : 'Activar'}>
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d={p.activo ? 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' : 'M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z'}/></svg>
                        </button>
                        <button onClick={() => openEdit(p)} className="p-2 text-white/40 hover:text-white hover:bg-white/5 rounded-lg transition">
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                        </button>
                        <button onClick={() => handleDelete(p)} className="p-2 text-white/40 hover:text-red-400 hover:bg-red-500/5 rounded-lg transition">
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {showModal && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
              <div className="bg-vascan-surface border border-white/10 rounded-2xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
                <h2 className="text-xl font-bold text-white mb-5">{editing ? 'Editar Periodo' : 'Nuevo Periodo'}</h2>
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-white/60 mb-1">Nombre</label>
                    <input value={form.nombre} onChange={e => setForm({...form, nombre: e.target.value})} placeholder="Ej: Inscripción Almuerzo Lunes"
                      className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white text-sm" />
                  </div>
                  {!editing && casinos.length > 0 && (
                    <div>
                      <div className="flex items-center justify-between mb-1.5">
                        <label className="block text-sm font-medium text-white/60">Casinos</label>
                        <button type="button" onClick={() => {
                          const allIds = casinos.map(c => c.id);
                          const allSel = allIds.every(id => form.casinoIds.includes(id));
                          setForm({...form, casinoIds: allSel ? [] : allIds});
                        }} className="text-xs font-medium text-vascan-gold hover:text-vascan-gold/80 transition px-2 py-0.5 rounded-lg bg-vascan-gold/10">
                          {casinos.every(c => form.casinoIds.includes(c.id)) ? 'Ninguno' : 'Todos'}
                        </button>
                      </div>
                      <div className="space-y-2 max-h-36 overflow-y-auto bg-white/5 rounded-xl p-3 border border-white/10">
                        {casinos.map(c => (
                          <label key={c.id} className="flex items-center gap-3 cursor-pointer hover:bg-white/5 rounded-lg px-2 py-1.5 transition">
                            <input type="checkbox" checked={form.casinoIds.includes(c.id)} onChange={() => toggleCasinoInPeriodo(c.id)}
                              className="w-4 h-4 rounded accent-amber-500" />
                            <span className="text-sm text-white/80">{c.nombre}</span>
                          </label>
                        ))}
                      </div>
                    </div>
                  )}
                  {editing && (
                    <div>
                      <label className="block text-sm font-medium text-white/60 mb-1">Casino</label>
                      <p className="text-white/50 text-sm px-4 py-2.5 bg-white/5 rounded-xl border border-white/10">
                        {casinos.find(c => c.id === form.casinoId)?.nombre || 'Casino asignado'}
                      </p>
                    </div>
                  )}
                  <div>
                    <label className="block text-sm font-medium text-white/60 mb-1">Fecha y hora de inicio</label>
                    <input type="datetime-local" value={form.fechaInicio} onChange={e => setForm({...form, fechaInicio: e.target.value})}
                      className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white text-sm" style={{colorScheme: 'dark'}} />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-white/60 mb-1">Fecha y hora de fin</label>
                    <input type="datetime-local" value={form.fechaFin} onChange={e => setForm({...form, fechaFin: e.target.value})}
                      className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white text-sm" style={{colorScheme: 'dark'}} />
                  </div>
                  <div className="border-t border-white/10 pt-4 mt-2">
                    <h3 className="text-sm font-semibold text-white/80 mb-1">Ventana de servicio (opcional)</h3>
                    <p className="text-xs text-white/40 mb-3">Días para los cuales el comensal podrá inscribirse durante este periodo. Si se deja vacío, podrán inscribirse a cualquier minuta futura.</p>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-medium text-white/60 mb-1">Desde</label>
                        <input type="date" value={form.fechaServicioInicio} onChange={e => setForm({...form, fechaServicioInicio: e.target.value})}
                          className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-white text-sm" style={{colorScheme: 'dark'}} />
                      </div>
                      <div>
                        <label className="block text-xs font-medium text-white/60 mb-1">Hasta</label>
                        <input type="date" value={form.fechaServicioFin} onChange={e => setForm({...form, fechaServicioFin: e.target.value})}
                          className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-white text-sm" style={{colorScheme: 'dark'}} />
                      </div>
                    </div>
                  </div>
                </div>
                <div className="flex gap-3 mt-6">
                  <button onClick={() => setShowModal(false)} className="flex-1 px-5 py-2.5 rounded-xl text-sm font-medium text-white/60 hover:text-white border border-white/10 hover:bg-white/5 transition">Cancelar</button>
                  <button onClick={handleSave} className="flex-1 bg-vascan-gold text-vascan-dark px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-vascan-gold/90 transition">{editing ? 'Guardar Cambios' : 'Crear Periodo'}</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── Carga Masiva ──
    function CargaMasivaView() {
      const [tab, setTab] = useState('usuarios');
      const [file, setFile] = useState(null);
      const [uploading, setUploading] = useState(false);
      const [result, setResult] = useState(null);
      const [error, setError] = useState('');

      async function handleUpload(endpoint) {
        if (!file) return;
        setUploading(true);
        setError('');
        setResult(null);
        try {
          const formData = new FormData();
          formData.append('file', file);
          const res = await fetch(`${API_BASE}${endpoint}`, { method: 'POST', credentials: 'include', body: formData });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Error al subir archivo');
          setResult(data);
          setFile(null);
        } catch (err) {
          setError(err.message);
        } finally {
          setUploading(false);
        }
      }

      function downloadTemplate(type) {
        window.open(`${API_BASE}/api/plantillas/${type}`, '_blank');
      }

      return (
        <div className="fade-in">
          <h1 className="text-2xl font-bold mb-6">Carga y Plantillas</h1>

          <div className="bg-vascan-surface rounded-2xl border border-white/10 p-6 mb-6">
            <h2 className="font-semibold mb-4 flex items-center gap-2">
              <svg className="w-5 h-5 text-vascan-gold" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
              Descargar Plantillas
            </h2>
            <p className="text-white/50 text-sm mb-4">Descargue las plantillas Excel profesionales para completar y luego cargar al sistema.</p>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <button onClick={() => downloadTemplate('usuarios')}
                className="flex items-center gap-4 p-4 bg-white/[0.03] border border-white/10 rounded-xl hover:border-vascan-gold/30 hover:bg-vascan-gold/5 transition text-left group">
                <div className="w-12 h-12 rounded-xl bg-blue-500/15 flex items-center justify-center flex-shrink-0">
                  <svg className="w-6 h-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                </div>
                <div>
                  <p className="font-semibold text-sm group-hover:text-vascan-gold transition">Plantilla de Usuarios</p>
                  <p className="text-white/40 text-xs mt-0.5">RUT, Nombre, Apellido, Rol, Casino</p>
                </div>
                <svg className="w-5 h-5 text-white/20 ml-auto group-hover:text-vascan-gold transition" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
              </button>
              <button onClick={() => downloadTemplate('minutas')}
                className="flex items-center gap-4 p-4 bg-white/[0.03] border border-white/10 rounded-xl hover:border-vascan-gold/30 hover:bg-vascan-gold/5 transition text-left group">
                <div className="w-12 h-12 rounded-xl bg-green-500/15 flex items-center justify-center flex-shrink-0">
                  <svg className="w-6 h-6 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
                </div>
                <div>
                  <p className="font-semibold text-sm group-hover:text-vascan-gold transition">Plantilla de Minutas</p>
                  <p className="text-white/40 text-xs mt-0.5">Planificación semanal por casino con consolidación</p>
                </div>
                <svg className="w-5 h-5 text-white/20 ml-auto group-hover:text-vascan-gold transition" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
              </button>
            </div>
          </div>

          <div className="bg-vascan-surface rounded-2xl border border-white/10 overflow-hidden">
            <div className="flex border-b border-white/10">
              <button onClick={() => { setTab('usuarios'); setFile(null); setResult(null); setError(''); }}
                className={`flex-1 px-5 py-3 text-sm font-medium transition ${tab === 'usuarios' ? 'text-vascan-gold border-b-2 border-vascan-gold bg-vascan-gold/5' : 'text-white/50 hover:text-white/70'}`}>
                Cargar Usuarios
              </button>
              <button onClick={() => { setTab('minutas'); setFile(null); setResult(null); setError(''); }}
                className={`flex-1 px-5 py-3 text-sm font-medium transition ${tab === 'minutas' ? 'text-vascan-gold border-b-2 border-vascan-gold bg-vascan-gold/5' : 'text-white/50 hover:text-white/70'}`}>
                Cargar Minutas
              </button>
            </div>

            <div className="p-6">
              {tab === 'usuarios' && (
                <div className="mb-4">
                  <h3 className="font-semibold text-sm mb-2">Formato requerido</h3>
                  <div className="overflow-x-auto">
                    <table className="text-xs border border-white/10 rounded-lg overflow-hidden w-full">
                      <thead><tr className="bg-white/5 text-white/60"><th className="px-3 py-2 text-left">RUT</th><th className="px-3 py-2 text-left">Nombre</th><th className="px-3 py-2 text-left">Apellido</th><th className="px-3 py-2 text-left">Rol</th><th className="px-3 py-2 text-left">Casino</th></tr></thead>
                      <tbody><tr className="text-white/30"><td className="px-3 py-1.5">12345678-9</td><td className="px-3 py-1.5">Juan</td><td className="px-3 py-1.5">Pérez</td><td className="px-3 py-1.5">comensal</td><td className="px-3 py-1.5">(Seleccionar del desplegable)</td></tr></tbody>
                    </table>
                  </div>
                  <p className="text-white/30 text-xs mt-2">Contraseña por defecto: primeros 4 dígitos del RUT</p>
                </div>
              )}

              {tab === 'minutas' && (
                <div className="mb-4">
                  <h3 className="font-semibold text-sm mb-2">Formato requerido</h3>
                  <p className="text-white/50 text-xs">Use la plantilla de minutas descargada arriba. Complete las opciones por día y vuelva a subir el archivo.</p>
                </div>
              )}

              {error && <div className="bg-red-500/15 border border-red-500/30 rounded-xl px-4 py-3 text-red-400 text-sm mb-4">{error}</div>}
              {result && (
                <div className="bg-green-500/10 border border-green-500/30 rounded-xl px-4 py-4 mb-4 fade-in">
                  <p className="text-green-400 font-semibold">Carga completada</p>
                  <p className="text-green-400/70 text-sm mt-1">{result.created} creados, {result.skipped} omitidos, {result.errors} errores</p>
                  {result.errorDetails?.length > 0 && (
                    <div className="mt-2 text-xs text-red-400/70 max-h-32 overflow-y-auto">
                      {result.errorDetails.map((e, i) => <div key={i}>{e.sheet ? `Hoja ${e.sheet}, ` : ''}Fila {e.row}: {e.error}</div>)}
                    </div>
                  )}
                </div>
              )}
              <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                <label className="flex-1 w-full">
                  <div className="border-2 border-dashed border-white/20 rounded-xl p-6 text-center cursor-pointer hover:border-vascan-gold/40 transition">
                    <svg className="w-10 h-10 mx-auto text-white/30 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>
                    <p className="text-sm text-white/50">{file ? file.name : 'Seleccionar archivo Excel (.xlsx)'}</p>
                    <input type="file" accept=".xlsx,.xls" onChange={e => setFile(e.target.files[0])} className="hidden" />
                  </div>
                </label>
                <button onClick={() => handleUpload(tab === 'usuarios' ? '/api/usuarios/upload' : '/api/minutas/upload')} disabled={!file || uploading}
                  className="bg-vascan-gold hover:bg-vascan-goldDark text-white font-semibold px-6 py-3 rounded-xl transition disabled:opacity-50 whitespace-nowrap text-sm">
                  {uploading ? 'Procesando...' : `Cargar ${tab === 'usuarios' ? 'Usuarios' : 'Minutas'}`}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── App Root ──
    function App() {
      const [user, setUser] = useState(null);
      const [view, setView] = useState('dashboard');
      const [checking, setChecking] = useState(true);

      useEffect(() => {
        apiFetch('/api/auth/me')
          .then(data => {
            if (data.user.role === 'admin' || data.user.role === 'interlocutor') {
              setUser(data.user);
              if (data.user.role === 'interlocutor') setView('consolidacion');
            }
          })
          .catch(() => {})
          .finally(() => setChecking(false));
      }, []);

      function handleLogout() {
        apiFetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
        setUser(null);
        setView('dashboard');
      }

      if (checking) return <LoadingSpinner />;
      if (!user) return <LoginScreen onLogin={u => setUser(u)} />;

      const views = {
        dashboard: DashboardView,
        usuarios: UsuariosView,
        casinos: CasinosView,
        minutas: MinutasView,
        consolidacion: ConsolidacionView,
        familias: FamiliasView,
        periodos: PeriodosView,
        carga: CargaMasivaView,
        totems: TotemsView,
      };

      const CurrentView = views[view] || DashboardView;

      return (
        <div className="flex min-h-screen">
          <Sidebar active={view} onNav={setView} onLogout={handleLogout} user={user} />
          <main className="flex-1 p-8 overflow-y-auto">
            <CurrentView key={view} user={user} />
          </main>
        </div>
      );
    }

    // ── Tótems (Fleet) ──
    function TotemsView() {
      const [totems, setTotems] = useState([]);
      const [casinos, setCasinos] = useState([]);
      const [loading, setLoading] = useState(true);
      const [token, setToken] = useState(null);
      const [tokenCasino, setTokenCasino] = useState(null);
      const [showInstaller, setShowInstaller] = useState(false);
      const [showCasinoSelect, setShowCasinoSelect] = useState(false);
      const [selectedCasinoForToken, setSelectedCasinoForToken] = useState('');
      const [releases, setReleases] = useState([]);
      const [showRelease, setShowRelease] = useState(false);
      const [releaseForm, setReleaseForm] = useState({ version: '', url: '', sha256: '', notas: '', obligatoria: false, publicada: true });

      function load() {
        setLoading(true);
        Promise.all([
          apiFetch('/api/totems'),
          apiFetch('/api/casinos/all'),
          apiFetch('/api/totem-releases').catch(() => []),
        ]).then(([t, c, r]) => { setTotems(t); setCasinos(c); setReleases(r); })
          .finally(() => setLoading(false));
      }
      useEffect(() => { load(); const i = setInterval(load, 30000); return () => clearInterval(i); }, []);

      function casinoNombre(id) { return (casinos.find(c => c.id === id) || {}).nombre || '—'; }
      function fmtDate(d) { if (!d) return '—'; const dt = new Date(d); return dt.toLocaleString('es-CL'); }
      function ageMin(d) { if (!d) return '∞'; return Math.floor((Date.now() - new Date(d).getTime()) / 60000); }

      function badgeFor(estado) {
        const map = {
          online: 'bg-green-500/20 text-green-400',
          intermitente: 'bg-yellow-500/20 text-yellow-400',
          offline: 'bg-red-500/20 text-red-400',
        };
        return <span className={`px-2 py-0.5 rounded-full text-xs font-semibold ${map[estado] || map.offline}`}>{estado}</span>;
      }

      function openCasinoSelect() {
        setSelectedCasinoForToken(casinos.length === 1 ? casinos[0].id : '');
        setShowCasinoSelect(true);
      }
      async function generateToken() {
        if (!selectedCasinoForToken) return;
        const r = await apiFetch('/api/totems/bootstrap-token', {
          method: 'POST',
          body: JSON.stringify({ casinoId: selectedCasinoForToken }),
        });
        setToken(r.token);
        setTokenCasino(r.casino);
        setShowCasinoSelect(false);
        setShowInstaller(true);
      }

      async function toggleActivo(t) {
        await apiFetch(`/api/totems/${t.id}`, { method: 'PUT', body: JSON.stringify({ activo: !t.activo }) });
        load();
      }
      async function deleteTotem(t) {
        if (!confirm(`¿Eliminar tótem "${t.nombre}"? Sus pedidos sincronizados se mantendrán.`)) return;
        await apiFetch(`/api/totems/${t.id}`, { method: 'DELETE' });
        load();
      }

      async function createRelease(e) {
        e.preventDefault();
        try {
          await apiFetch('/api/totem-releases', { method: 'POST', body: JSON.stringify(releaseForm) });
          setReleaseForm({ version: '', url: '', sha256: '', notas: '', obligatoria: false, publicada: true });
          setShowRelease(false);
          load();
        } catch (err) { alert(err.message || 'Error'); }
      }
      async function togglePublish(r) {
        await apiFetch(`/api/totem-releases/${r.id}`, { method: 'PUT', body: JSON.stringify({ publicada: !r.publicada }) });
        load();
      }

      if (loading) return <LoadingSpinner />;

      return (
        <div>
          <div className="flex items-center justify-between mb-6">
            <div>
              <h1 className="text-2xl font-bold">Tótems</h1>
              <p className="text-sm text-white/60 mt-1">Estaciones offline en cada casino. Sincronizan automáticamente con la nube.</p>
            </div>
            <div className="flex gap-2">
              <button onClick={() => setShowRelease(true)} className="px-4 py-2 bg-white/5 border border-white/10 hover:bg-white/10 rounded-xl text-sm font-medium">Nueva versión</button>
              <button onClick={openCasinoSelect} className="px-4 py-2 bg-vascan-gold text-vascan-bg hover:bg-vascan-gold/90 rounded-xl text-sm font-bold">+ Instalar nuevo tótem</button>
            </div>
          </div>

          <div className="bg-vascan-surface border border-white/10 rounded-2xl overflow-hidden">
            <table className="w-full text-sm">
              <thead className="bg-white/5 text-white/60">
                <tr>
                  <th className="text-left px-4 py-3">Nombre</th>
                  <th className="text-left px-4 py-3">Casino</th>
                  <th className="text-left px-4 py-3">Estado</th>
                  <th className="text-left px-4 py-3">Última conexión</th>
                  <th className="text-left px-4 py-3">Pendientes</th>
                  <th className="text-left px-4 py-3">Versión</th>
                  <th className="text-left px-4 py-3">IP</th>
                  <th className="text-left px-4 py-3"></th>
                </tr>
              </thead>
              <tbody>
                {totems.length === 0 && (
                  <tr><td colSpan={8} className="px-4 py-12 text-center text-white/40">No hay tótems registrados todavía. Generá un token e instalá el primero.</td></tr>
                )}
                {totems.map(t => (
                  <tr key={t.id} className="border-t border-white/5">
                    <td className="px-4 py-3 font-medium">
                      {t.nombre}
                      {!t.activo && <span className="ml-2 text-xs text-white/40">(inactivo)</span>}
                    </td>
                    <td className="px-4 py-3 text-white/70">{casinoNombre(t.casinoId)}</td>
                    <td className="px-4 py-3">{badgeFor(t.estado)}</td>
                    <td className="px-4 py-3 text-white/60">
                      {fmtDate(t.ultimaConexion)}
                      <div className="text-xs text-white/40">hace {ageMin(t.ultimaConexion)} min</div>
                    </td>
                    <td className="px-4 py-3">
                      <span className={t.pedidosPendientes > 0 ? 'text-yellow-400 font-bold' : 'text-white/40'}>{t.pedidosPendientes ?? 0}</span>
                    </td>
                    <td className="px-4 py-3 text-white/60">{t.version || '—'}</td>
                    <td className="px-4 py-3 text-white/60 text-xs">
                      <div>pub: {t.ipPublica || '—'}</div>
                      <div>local: {t.ipLocal || '—'}</div>
                    </td>
                    <td className="px-4 py-3 text-right">
                      <button onClick={() => toggleActivo(t)} className="text-xs text-vascan-gold hover:underline mr-3">{t.activo ? 'Desactivar' : 'Activar'}</button>
                      <button onClick={() => deleteTotem(t)} className="text-xs text-red-400 hover:underline">Eliminar</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div className="mt-8">
            <h2 className="text-lg font-bold mb-3">Versiones publicadas</h2>
            <div className="bg-vascan-surface border border-white/10 rounded-2xl overflow-hidden">
              <table className="w-full text-sm">
                <thead className="bg-white/5 text-white/60">
                  <tr>
                    <th className="text-left px-4 py-3">Versión</th>
                    <th className="text-left px-4 py-3">URL</th>
                    <th className="text-left px-4 py-3">Publicada</th>
                    <th className="text-left px-4 py-3">Obligatoria</th>
                    <th className="text-left px-4 py-3">Notas</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  {releases.length === 0 && <tr><td colSpan={6} className="px-4 py-8 text-center text-white/40">Sin versiones publicadas</td></tr>}
                  {releases.map(r => (
                    <tr key={r.id} className="border-t border-white/5">
                      <td className="px-4 py-3 font-mono">{r.version}</td>
                      <td className="px-4 py-3 text-white/60 text-xs truncate max-w-xs"><a href={r.url} target="_blank" className="hover:text-vascan-gold">{r.url}</a></td>
                      <td className="px-4 py-3">{r.publicada ? '✓' : '—'}</td>
                      <td className="px-4 py-3">{r.obligatoria ? '✓' : '—'}</td>
                      <td className="px-4 py-3 text-white/60 text-xs">{r.notas || '—'}</td>
                      <td className="px-4 py-3 text-right"><button onClick={() => togglePublish(r)} className="text-xs text-vascan-gold hover:underline">{r.publicada ? 'Despublicar' : 'Publicar'}</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {showCasinoSelect && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50" onClick={() => setShowCasinoSelect(false)}>
              <div className="bg-vascan-surface border border-white/10 rounded-2xl p-6 max-w-md w-full" onClick={e => e.stopPropagation()}>
                <h3 className="text-lg font-bold mb-1">Nuevo tótem</h3>
                <p className="text-sm text-white/60 mb-4">¿En qué casino se instalará este tótem?</p>
                <select
                  className="w-full px-3 py-2 bg-vascan-bg border border-white/10 rounded-lg text-sm mb-4"
                  value={selectedCasinoForToken}
                  onChange={e => setSelectedCasinoForToken(e.target.value)}
                >
                  <option value="">— Seleccionar casino —</option>
                  {casinos.filter(c => c.activo).map(c => (
                    <option key={c.id} value={c.id}>{c.nombre}</option>
                  ))}
                </select>
                <div className="flex gap-2">
                  <button onClick={() => setShowCasinoSelect(false)} className="flex-1 px-4 py-2 bg-white/5 rounded-xl text-sm">Cancelar</button>
                  <button onClick={generateToken} disabled={!selectedCasinoForToken} className="flex-1 px-4 py-2 bg-vascan-gold text-vascan-bg rounded-xl text-sm font-bold disabled:opacity-40">Generar token</button>
                </div>
              </div>
            </div>
          )}

          {showInstaller && token && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50" onClick={() => setShowInstaller(false)}>
              <div className="bg-vascan-surface border border-white/10 rounded-2xl p-6 max-w-2xl w-full" onClick={e => e.stopPropagation()}>
                <h3 className="text-lg font-bold mb-1">Instalar tótem</h3>
                {tokenCasino && <p className="text-sm text-vascan-gold mb-3">Casino: <strong>{tokenCasino.nombre}</strong></p>}
                <p className="text-sm text-white/60 mb-4">Token de un solo uso · válido 1 hora · se destruye al usarse</p>
                <div className="bg-vascan-bg border border-white/10 rounded-xl p-4 mb-5">
                  <div className="text-xs text-white/40 mb-1">Token</div>
                  <code className="text-vascan-gold text-sm break-all select-all">{token}</code>
                </div>
                <div className="text-sm text-white/80 space-y-2 mb-4">
                  <p className="font-semibold">En el PC del tótem (PowerShell como Administrador):</p>
                  <div className="bg-vascan-bg border border-white/10 rounded-xl p-3">
                    <code className="text-xs text-white/80 block">Set-ExecutionPolicy -Scope Process Bypass -Force</code>
                    <code className="text-xs text-white/80 block mt-1">iwr {location.origin}/totem/install.ps1 -UseBasicParsing | iex</code>
                  </div>
                  <p className="text-white/60 text-xs">Pedirá: token (el de arriba) y nombre del tótem. Casino ya está incluido en el token.</p>
                </div>
                <button onClick={() => setShowInstaller(false)} className="px-4 py-2 bg-vascan-gold text-vascan-bg rounded-xl text-sm font-bold">Listo</button>
              </div>
            </div>
          )}

          {showRelease && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50" onClick={() => setShowRelease(false)}>
              <form onSubmit={createRelease} className="bg-vascan-surface border border-white/10 rounded-2xl p-6 max-w-lg w-full space-y-3" onClick={e => e.stopPropagation()}>
                <h3 className="text-lg font-bold">Nueva versión del tótem</h3>
                <div><label className="text-xs text-white/60">Versión (ej. 1.2.0)</label><input required className="w-full px-3 py-2 bg-vascan-bg border border-white/10 rounded-lg" value={releaseForm.version} onChange={e => setReleaseForm({...releaseForm, version: e.target.value})} /></div>
                <div><label className="text-xs text-white/60">URL del instalador (.exe)</label><input required className="w-full px-3 py-2 bg-vascan-bg border border-white/10 rounded-lg" value={releaseForm.url} onChange={e => setReleaseForm({...releaseForm, url: e.target.value})} /></div>
                <div><label className="text-xs text-white/60">SHA-256 del instalador</label><input required className="w-full px-3 py-2 bg-vascan-bg border border-white/10 rounded-lg font-mono text-xs" value={releaseForm.sha256} onChange={e => setReleaseForm({...releaseForm, sha256: e.target.value})} /></div>
                <div><label className="text-xs text-white/60">Notas</label><textarea className="w-full px-3 py-2 bg-vascan-bg border border-white/10 rounded-lg" rows={2} value={releaseForm.notas} onChange={e => setReleaseForm({...releaseForm, notas: e.target.value})} /></div>
                <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={releaseForm.obligatoria} onChange={e => setReleaseForm({...releaseForm, obligatoria: e.target.checked})} /> Obligatoria</label>
                <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={releaseForm.publicada} onChange={e => setReleaseForm({...releaseForm, publicada: e.target.checked})} /> Publicar inmediatamente</label>
                <div className="flex gap-2 pt-2">
                  <button type="button" onClick={() => setShowRelease(false)} className="flex-1 px-4 py-2 bg-white/5 rounded-xl text-sm">Cancelar</button>
                  <button type="submit" className="flex-1 px-4 py-2 bg-vascan-gold text-vascan-bg rounded-xl text-sm font-bold">Crear</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
