                      <span className="text-sm text-white/80">{c.nombre}</span>
                    </label>
                  ))}
                </div>
              </div>
              <div className="flex justify-end gap-3 pt-2">
                <button type="button" onClick={() => setShowCloneModal(false)} className="px-5 py-2.5 rounded-xl bg-white/10 hover:bg-white/15 text-sm font-medium transition">Cancelar</button>
                <button type="submit" className="px-5 py-2.5 rounded-xl bg-green-600 hover:bg-green-700 text-sm font-medium transition">
                  Clonar Minuta
                </button>
              </div>
            </form>
          </Modal>

          <ConfirmDialog open={!!deleteTarget} onClose={() => setDeleteTarget(null)} onConfirm={handleDelete}
            message={`¿Desactivar la minuta del ${deleteTarget?.fecha}?`} />
        </div>
      );
    }

    // ── Consolidación ──
    function ConsolidacionView({ user }) {
      const [allCasinos, setAllCasinos] = useState([]);
      const [casinos, setCasinos] = useState([]);
      const [selectedCasino, setSelectedCasino] = useState('');
      const [dateFrom, setDateFrom] = useState(new Date().toISOString().split('T')[0]);
      const [dateTo, setDateTo] = useState(new Date().toISOString().split('T')[0]);
      const [report, setReport] = useState(null);
      const [loading, setLoading] = useState(false);
      const [downloading, setDownloading] = useState(false);
      const [loadingCasinos, setLoadingCasinos] = useState(true);
      const [weekReport, setWeekReport] = useState(null);
      const [showLive, setShowLive] = useState(false);
      const [liveRows, setLiveRows] = useState([]);
      const [liveLoading, setLiveLoading] = useState(false);
      const [liveUpdatedAt, setLiveUpdatedAt] = useState(null);
      const [liveError, setLiveError] = useState('');
      const [liveFilter, setLiveFilter] = useState('');
      const [confirmDelete, setConfirmDelete] = useState(null); // pedido row pendiente de anular
      const [deleting, setDeleting] = useState(false);

      async function handleDeletePedido() {
        if (!confirmDelete) return;
        setDeleting(true);
        try {
          const resp = await fetch(`/api/pedidos/${confirmDelete.id}`, { method: 'DELETE', credentials: 'include' });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok) throw new Error(data.message || 'Error al anular pedido');
          setToast?.({ message: data.message || 'Pedido anulado correctamente', type: 'success' });
          setConfirmDelete(null);
          // Refrescar tabla en vivo + dashboard
          fetchLive();
          handleSearch();
        } catch (err) {
          setToast?.({ message: err?.message || 'Error al anular pedido', type: 'error' });
        } finally {
          setDeleting(false);
        }
      }

      const fetchLive = React.useCallback(async () => {
        if (!dateFrom) return;
        const casinoParam = selectedCasino || 'all';
        const dateToParam = dateTo || dateFrom;
        try {
          setLiveLoading(true);
          const data = await apiFetch(`/api/reportes/inscripciones-live?fechaDesde=${dateFrom}&fechaHasta=${dateToParam}&casinoId=${casinoParam}`);
          setLiveRows(data.rows || []);
          setLiveUpdatedAt(new Date());
          setLiveError('');
        } catch (err) {
          console.error(err);
          setLiveError(err?.message || 'Error al cargar detalle');
        } finally {
          setLiveLoading(false);
        }
      }, [dateFrom, dateTo, selectedCasino]);

      useEffect(() => {
        if (!showLive) return;
        fetchLive();
        const id = setInterval(fetchLive, 10000);
        return () => clearInterval(id);
      }, [showLive, fetchLive]);

      useEffect(() => {
        apiFetch('/api/casinos').then(data => {
          setAllCasinos(data);
          // Interlocutor: filter to their assigned casino only
          if (user?.role === 'interlocutor' && user?.casinoId) {
            const mine = data.filter(c => c.id === user.casinoId);
            setCasinos(mine);
            setSelectedCasino(user.casinoId);
          } else {
            setCasinos(data);
            setSelectedCasino('all');
          }
          setLoadingCasinos(false);
        }).catch(() => setLoadingCasinos(false));
      }, []);

      async function handleSearch() {
        if (!dateFrom) return;
        setLoading(true);
        setReport(null);
        setWeekReport(null);
        try {
          const casinoParam = selectedCasino || 'all';
          const dateToParam = dateTo || dateFrom;
          const [dayData, weekData] = await Promise.all([
            apiFetch(`/api/reportes/consolidacion?casinoId=${casinoParam}&fecha=${dateFrom}&fechaHasta=${dateToParam}`),
            (casinoParam !== 'all' && dateFrom === dateToParam)
              ? apiFetch(`/api/reportes/consolidacion-semanal?casinoId=${casinoParam}&fecha=${dateFrom}`).catch(() => null)
              : Promise.resolve(null),
          ]);
          setReport(dayData);
          setWeekReport(weekData);
        } catch (err) { console.error(err); }
        setLoading(false);
      }

      async function downloadExcel() {
        if (!selectedCasino || !dateFrom) return;
        setDownloading(true);
        try {
          const resp = await fetch(`/api/reportes/programacion-semanal?casinoId=${selectedCasino}&fecha=${dateFrom}`, { credentials: 'include' });
          if (!resp.ok) throw new Error('Error al descargar');
          const blob = await resp.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          const disp = resp.headers.get('content-disposition') || '';
          const match = disp.match(/filename="?([^"]+)"?/);
          a.download = match ? match[1] : 'programacion_semanal.xlsx';
          a.click();
          URL.revokeObjectURL(url);
        } catch (err) { console.error(err); }
        setDownloading(false);
      }

      async function downloadDetailReport(kind) {
        setDownloading(true);
        try {
          const casinoParam = selectedCasino || 'all';
          let url = '';
          let fallbackName = '';
          if (kind === 'inscripcion') {
            url = `/api/reportes/inscripcion-detalle?fechaDesde=${dateFrom}&fechaHasta=${dateTo || dateFrom}&casinoId=${casinoParam}`;
            fallbackName = `Inscripciones_${dateFrom}.xlsx`;
          } else if (kind === 'consumo') {
            url = `/api/reportes/consumo-detalle?fechaDesde=${dateFrom}&fechaHasta=${dateTo || dateFrom}&casinoId=${casinoParam}`;
            fallbackName = `Consumo_${dateFrom}.xlsx`;
          } else if (kind === 'minutas') {
            const mes = (dateFrom || new Date().toISOString().split('T')[0]).slice(0, 7);
            url = `/api/reportes/minutas-detalle?mes=${mes}&casinoId=${casinoParam}`;
            fallbackName = `Minutas_${mes}.xlsx`;
          }
          const resp = await fetch(url, { credentials: 'include' });
          if (!resp.ok) {
            const err = await resp.json().catch(() => ({ message: 'Error al generar reporte' }));
            setToast?.({ message: err.message || 'Error al generar reporte', type: 'error' });
            throw new Error(err.message);
          }
          const blob = await resp.blob();
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          const disp = resp.headers.get('content-disposition') || '';
          const match = disp.match(/filename="?([^"]+)"?/);
          a.download = match ? match[1] : fallbackName;
          a.click();
          URL.revokeObjectURL(blobUrl);
        } catch (err) { console.error(err); }
        setDownloading(false);
      }

      if (loadingCasinos) return <LoadingSpinner />;

      return (
        <div className="fade-in">
          <h1 className="text-2xl font-bold mb-6">Consolidación / Programación</h1>
          <div className="bg-vascan-surface rounded-2xl border border-white/10 p-6 mb-6">
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
              <div>
                <label className="block text-sm font-medium text-white/70 mb-1.5">Casino</label>
                <select value={selectedCasino} onChange={e => setSelectedCasino(e.target.value)}
                  className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-vascan-gold/50 transition text-sm" style={{colorScheme: 'dark'}}>
                  {user?.role !== 'interlocutor' && <option value="all">Todos los casinos</option>}
                  {casinos.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
                </select>
              </div>
              <InputField label="Fecha desde" value={dateFrom} onChange={v => { setDateFrom(v); if (v > dateTo) setDateTo(v); }} type="date" />
              <InputField label="Fecha hasta" value={dateTo} onChange={v => setDateTo(v < dateFrom ? dateFrom : v)} type="date" />
              <div className="flex gap-2">
                <button onClick={handleSearch} disabled={loading}
                  className="flex-1 bg-vascan-gold hover:bg-vascan-goldDark text-white font-semibold py-2.5 rounded-xl transition disabled:opacity-50 text-sm">
                  {loading ? 'Consultando...' : 'Consultar'}
                </button>
                {selectedCasino && selectedCasino !== 'all' && (
                  <button onClick={downloadExcel} disabled={downloading}
                    className="px-3 py-2.5 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-xl transition disabled:opacity-50 text-sm flex items-center justify-center gap-1" title="Descargar Excel Semanal">
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    {downloading ? '...' : 'XLS'}
                  </button>
                )}
              </div>
            </div>
            <div className="mt-4 pt-4 border-t border-white/10">
              <p className="text-xs font-semibold text-white/40 uppercase tracking-wider mb-2">Descargar reportes detallados (Excel)</p>
              <div className="flex flex-wrap gap-2">
                <button onClick={() => downloadDetailReport('inscripcion')} disabled={downloading || !dateFrom}
                  className="px-3 py-2 bg-blue-600/20 hover:bg-blue-600/30 border border-blue-500/30 text-blue-300 text-xs font-medium rounded-lg transition disabled:opacity-50 flex items-center gap-1.5">
                  <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                  Inscripción x rango
                </button>
                <button onClick={() => downloadDetailReport('consumo')} disabled={downloading || !dateFrom}
                  className="px-3 py-2 bg-amber-600/20 hover:bg-amber-600/30 border border-amber-500/30 text-amber-300 text-xs font-medium rounded-lg transition disabled:opacity-50 flex items-center gap-1.5">
                  <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                  Consumo x rango
                </button>
                <button onClick={() => downloadDetailReport('minutas')} disabled={downloading || !dateFrom}
                  className="px-3 py-2 bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/30 text-emerald-300 text-xs font-medium rounded-lg transition disabled:opacity-50 flex items-center gap-1.5">
                  <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                  Minutas del mes (mes de "Fecha desde")
                </button>
              </div>
            </div>
          </div>

          {report && (
            <div className="bg-vascan-surface rounded-2xl border border-white/10 overflow-hidden fade-in">
              <div className="p-5 border-b border-white/10">
                <h2 className="font-semibold text-lg">Resumen de Producción</h2>
                <p className="text-white/50 text-sm mt-0.5">
                  {report.casinoNombre} — {report.fecha}{report.fechaHasta && report.fechaHasta !== report.fecha ? ` al ${report.fechaHasta}` : ''}
                </p>
              </div>
              {report.dailyRows && report.dailyRows.length > 0 && (
                <div className="p-4 border-b border-white/10 overflow-x-auto">
                  <p className="text-xs font-semibold text-white/40 uppercase tracking-wider mb-2">Desglose por día</p>
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="text-white/40 text-xs border-b border-white/5">
                        <th className="text-left pb-2 pr-4">Fecha</th>
                        <th className="text-left pb-2 pr-4">Casino</th>
                        <th className="text-right pb-2 pr-4">Comensales</th>
                        <th className="text-right pb-2">No asisten</th>
                      </tr>
                    </thead>
                    <tbody>
                      {report.dailyRows.map((row, i) => (
                        <tr key={i} className="border-b border-white/5 hover:bg-white/[0.02]">
                          <td className="py-1.5 pr-4 font-mono text-xs text-white/60">{row.fecha}</td>
                          <td className="py-1.5 pr-4 text-white/80">{row.casinoNombre}</td>
                          <td className="py-1.5 pr-4 text-right font-semibold">{row.total}</td>
                          <td className="py-1.5 text-right text-orange-400">{row.noAsiste > 0 ? row.noAsiste : '—'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
              {!report.minuta ? (
                <div className="p-8 text-center text-white/40">No hay minuta registrada para esta fecha</div>
              ) : (
                <div>
                  <table className="w-full">
                    <thead>
                      <tr className="border-b border-white/10 text-white/50 text-sm">
                        <th className="text-left px-5 py-3">Opción</th>
                        <th className="text-left px-5 py-3">Descripción</th>
                        <th className="text-right px-5 py-3">Pedidos</th>
                        <th className="text-right px-5 py-3">%</th>
                      </tr>
                    </thead>
                    <tbody>
                      {report.opciones.map((op, i) => (
                        <tr key={i} className="border-b border-white/5 hover:bg-white/[0.02]">
                          <td className="px-5 py-4">
                            <span className="inline-flex items-center justify-center w-8 h-8 rounded-full bg-vascan-gold/20 text-vascan-gold font-bold text-sm">{op.numero}</span>
                          </td>
                          <td className="px-5 py-4 text-white/80">{op.descripcion}</td>
                          <td className="px-5 py-4 text-right font-semibold text-lg">{op.cantidad}</td>
                          <td className="px-5 py-4 text-right text-white/50">{op.porcentaje}%</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <div className="px-5 py-4 bg-white/[0.02] space-y-2">
                    <div className="flex justify-between items-center">
                      <span className="font-semibold text-white/70">Total comensales inscritos</span>
                      <span className="font-bold text-xl text-vascan-gold">{report.totalPedidos}</span>
                    </div>

            <div className="p-5 border-b border-white/10 flex items-center justify-between flex-wrap gap-3">
              <div className="flex items-center gap-3">
                <span className={`relative flex h-2.5 w-2.5 ${showLive ? '' : 'opacity-40'}`}>
                  {showLive && <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>}
                  <span className={`relative inline-flex rounded-full h-2.5 w-2.5 ${showLive ? 'bg-green-500' : 'bg-white/30'}`}></span>
                </span>
                <div>
                  <h2 className="font-semibold text-lg">Detalle en vivo de inscripciones</h2>
                  <p className="text-white/50 text-xs mt-0.5">
                    {showLive
                      ? <>Actualiza cada 10s · {liveRows.length} {liveRows.length === 1 ? 'registro' : 'registros'}{liveUpdatedAt ? ` · última: ${liveUpdatedAt.toLocaleTimeString('es-CL')}` : ''}{liveLoading ? ' · cargando…' : ''}</>
                      : 'Click en "Mostrar" para ver cada inscripción individual con hora, RUT, opción y origen'}
                  </p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                {showLive && (
                  <input
                    value={liveFilter}
                    onChange={e => setLiveFilter(e.target.value)}

                  />
                )}
                {showLive && (
                  <button onClick={fetchLive} disabled={liveLoading}
                    className="px-3 py-1.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-xs text-white/80 transition disabled:opacity-50" title="Refrescar ahora">
                    ↻
                  </button>
                )}
                <button onClick={() => setShowLive(s => !s)}
                  className={`px-4 py-2 rounded-lg text-xs font-semibold transition ${showLive ? 'bg-white/10 hover:bg-white/15 text-white' : 'bg-vascan-gold hover:bg-vascan-goldDark text-white'}`}>
                  {showLive ? 'Ocultar detalle' : 'Mostrar detalle en vivo'}
                </button>

            {showLive && (
              <div className="overflow-x-auto max-h-[600px] overflow-y-auto">
                {liveError ? (
                  <div className="p-6 text-center text-red-400 text-sm">{liveError}</div>

                  <div className="p-8 text-center text-white/40 text-sm">No hay inscripciones en el rango seleccionado</div>

                    <thead className="sticky top-0 bg-vascan-surface z-10">

                        <th className="text-left px-4 py-2.5">RUT</th>
                        <th className="text-left px-4 py-2.5">Comensal</th>
                        <th className="text-left px-4 py-2.5">Casino</th>
                        <th className="text-left px-4 py-2.5">Familia</th>
                        <th className="text-left px-4 py-2.5">Opción</th>
                        <th className="text-left px-4 py-2.5">Día servicio</th>
                        <th className="text-left px-4 py-2.5">Tipo</th>
                        <th className="text-left px-4 py-2.5">Origen</th>
                        <th className="text-right px-4 py-2.5">Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      {liveRows
                        .filter(r => {
                          if (!liveFilter.trim()) return true;
                          const q = liveFilter.toLowerCase();
                          return [r.rut, r.comensal, r.casino, r.familia, r.opcionTexto, r.tipo].some(v => String(v || '').toLowerCase().includes(q));
                        })
                        .map(r => {
                          const d = r.createdAt ? new Date(r.createdAt) : null;
                          const horaStr = d
                            ? `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`
                            : '—';
                          const fechaStr = d ? d.toLocaleDateString('es-CL') : '';
                          const tipoBadge = r.tipo === 'no_asiste'
                            ? <span className="px-2 py-0.5 rounded-full bg-orange-500/20 text-orange-300 text-[10px] font-semibold uppercase">No asiste</span>

                              : <span className="px-2 py-0.5 rounded-full bg-green-500/20 text-green-300 text-[10px] font-semibold uppercase">Selección</span>;
                          const origenBadge = r.origenTotemId
                            ? <span className="px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-300 text-[10px] font-mono uppercase" title={`Tótem ${r.origenTotemId}`}>Tótem</span>

                              <td className="px-4 py-2 font-mono text-xs whitespace-nowrap">
                                <div className="text-white">{horaStr}</div>
                                <div className="text-white/30 text-[10px]">{fechaStr}</div>
                              </td>
                              <td className="px-4 py-2 font-mono text-xs text-white/70">{r.rut || '—'}</td>
                              <td className="px-4 py-2 text-white/90">{r.comensal}</td>
                              <td className="px-4 py-2 text-white/70 text-xs">{r.casino}</td>
                              <td className="px-4 py-2">
