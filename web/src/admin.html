<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin — BuenaMezcla Comensales</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            vascan: {
              bg: '#1A1A2E',
              surface: '#16213E',
              card: '#0F3460',
              gold: '#D4A843',
              goldLight: '#E8C96A',
              goldDark: '#B8902E',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    select option { background: #16213E; color: white; }
  </style>
</head>
<body class="bg-vascan-bg min-h-screen text-white">
  <div id="root"></div>
  <script type="text/babel" data-type="module">
    const { useState, useEffect, useCallback } = React;

    const API_BASE = window.location.origin;

    async function apiFetch(path, options = {}) {
      const separator = path.includes('?') ? '&' : '?';
      const url = `${API_BASE}${path}${separator}_t=${Date.now()}`;
      const res = await fetch(url, {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json', ...options.headers },
        ...options,
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({ message: res.statusText }));
        throw new Error(data.message || res.statusText);
      }
      return res.json();
    }

    function Modal({ open, onClose, title, children }) {
      if (!open) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4" onClick={onClose}>
          <div className="bg-vascan-surface border border-white/10 rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto fade-in" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between p-5 border-b border-white/10">
              <h2 className="font-bold text-lg">{title}</h2>
              <button onClick={onClose} className="text-white/40 hover:text-white text-xl leading-none">&times;</button>
            </div>
            <div className="p-5">{children}</div>
          </div>
        </div>
      );
    }

    function ConfirmDialog({ open, onClose, onConfirm, message }) {
      if (!open) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4" onClick={onClose}>
          <div className="bg-vascan-surface border border-white/10 rounded-2xl w-full max-w-sm fade-in" onClick={e => e.stopPropagation()}>
            <div className="p-6 text-center">
              <div className="w-12 h-12 rounded-full bg-red-500/20 flex items-center justify-center mx-auto mb-4">
                <svg className="w-6 h-6 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" /></svg>
              </div>
              <p className="text-white/80 mb-6">{message}</p>
              <div className="flex gap-3 justify-center">
                <button onClick={onClose} className="px-5 py-2.5 rounded-xl bg-white/10 hover:bg-white/15 text-sm font-medium transition">Cancelar</button>
                <button onClick={onConfirm} className="px-5 py-2.5 rounded-xl bg-red-500 hover:bg-red-600 text-sm font-medium transition">Eliminar</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function InputField({ label, value, onChange, type = 'text', placeholder = '', required = false }) {
      return (
        <div>
          <label className="block text-sm font-medium text-white/70 mb-1.5">{label}</label>
          <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} required={required}
            className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white placeholder-white/30 focus:outline-none focus:border-vascan-gold/50 focus:ring-1 focus:ring-vascan-gold/30 transition text-sm" />
        </div>
      );
    }

    function SelectField({ label, value, onChange, options }) {
      return (
        <div>
          <label className="block text-sm font-medium text-white/70 mb-1.5">{label}</label>
          <select value={value} onChange={e => onChange(e.target.value)}
            className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-vascan-gold/50 transition text-sm" style={{colorScheme: 'dark'}}>
            {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        </div>
      );
    }

    function LoadingSpinner() {
      return <div className="flex justify-center py-12"><div className="w-8 h-8 border-2 border-vascan-gold/30 border-t-vascan-gold rounded-full animate-spin"></div></div>;
    }

    function Toast({ message, type = 'success', onClose }) {
      useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
      const bg = type === 'success' ? 'bg-green-500/15 border-green-500/30 text-green-400' : 'bg-red-500/15 border-red-500/30 text-red-400';
      return (
        <div className={`fixed top-4 right-4 z-[60] px-5 py-3 rounded-xl border text-sm font-medium fade-in ${bg}`}>
          {message}
        </div>
      );
    }

    function formatRutInput(value) {
      let cleaned = value.replace(/[^0-9kK]/g, '').toUpperCase();
      if (cleaned.length > 9) cleaned = cleaned.slice(0, 9);
      if (cleaned.length <= 1) return cleaned;
      const body = cleaned.slice(0, -1);
      const dv = cleaned.slice(-1);
      let formatted = '';
      const reversed = body.split('').reverse();
      for (let i = 0; i < reversed.length; i++) {
        if (i > 0 && i % 3 === 0) formatted = '.' + formatted;
        formatted = reversed[i] + formatted;
      }
      return formatted + '-' + dv;
    }

    function cleanRut(formattedRut) {
      return formattedRut.replace(/\./g, '');
    }

    function validarRutChileno(rutCompleto) {
      const cleaned = rutCompleto.replace(/\./g, '').replace(/-/g, '').trim().toUpperCase();
      if (cleaned.length < 2) return false;
      const cuerpo = cleaned.slice(0, -1);
      const dvIngresado = cleaned.slice(-1);
      if (!/^\d+$/.test(cuerpo)) return false;
      let suma = 0;
      let multiplicador = 2;
      for (let i = cuerpo.length - 1; i >= 0; i--) {
        suma += parseInt(cuerpo[i]) * multiplicador;
        multiplicador = multiplicador === 7 ? 2 : multiplicador + 1;
      }
      const resto = suma % 11;
      const dvCalculado = resto === 0 ? '0' : resto === 1 ? 'K' : String(11 - resto);
      return dvIngresado === dvCalculado;
    }

    function looksLikeRut(val) {
      return /\d/.test(val) && /^[\d.\-kK]+$/.test(val.trim());
    }

    // ── Login Screen ──
    function LoginScreen({ onLogin }) {
      const [identifier, setIdentifier] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      function looksLikeRut(val) {
        return /\d/.test(val) && /^[\d.\-kK]+$/.test(val.trim());
      }

      function handleIdentifierChange(val) {
        if (looksLikeRut(val)) {
          setIdentifier(formatRutInput(val));
        } else {
          setIdentifier(val);
        }
      }

      async function handleSubmit(e) {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const loginValue = looksLikeRut(identifier) ? cleanRut(identifier) : identifier.trim();
          const data = await apiFetch('/api/auth/login', { method: 'POST', body: JSON.stringify({ rut: loginValue, password }) });
          if (data.user.role !== 'admin' && data.user.role !== 'interlocutor') { setError('Acceso restringido'); return; }
          onLogin(data.user);
        } catch (err) {
          setError('Usuario o contraseña incorrectos');
        } finally {
          setLoading(false);
        }
      }

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="w-full max-w-md">
            <div className="text-center mb-8">
              <img src="/logo.png" alt="BuenaMezcla" className="w-24 h-24 mx-auto mb-4" />
              <h1 className="text-2xl font-bold text-white">BuenaMezcla</h1>
              <p className="text-white/50 mt-1">Panel de Administración — Sistema de Comensales</p>
            </div>
            <form onSubmit={handleSubmit} className="bg-vascan-surface rounded-2xl p-6 space-y-5 border border-white/10">
              {error && <div className="bg-red-500/15 border border-red-500/30 rounded-xl px-4 py-3 text-red-400 text-sm">{error}</div>}
              <InputField label="Usuario o RUT" value={identifier} onChange={handleIdentifierChange} placeholder="usuario o 11.111.111-1" required />
              <InputField label="Contraseña" value={password} onChange={setPassword} type="password" placeholder="••••••" required />
              <button type="submit" disabled={loading} className="w-full bg-vascan-gold hover:bg-vascan-goldDark text-white font-semibold py-3 rounded-xl transition disabled:opacity-50">
                {loading ? 'Ingresando...' : 'Iniciar Sesión'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ── Sidebar ──
    function Sidebar({ active, onNav, onLogout, user }) {
      const allItems = [
        { id: 'dashboard', label: 'Dashboard', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6', roles: ['admin', 'interlocutor'] },
        { id: 'consolidacion', label: 'Consolidación', icon: 'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z', roles: ['admin', 'interlocutor'] },
        { id: 'usuarios', label: 'Usuarios', icon: 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z', roles: ['admin', 'interlocutor'] },
        { id: 'casinos', label: 'Casinos', icon: 'M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4', roles: ['admin'] },
        { id: 'minutas', label: 'Minutas', icon: 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01', roles: ['admin', 'interlocutor'] },
        { id: 'familias', label: 'Familias', icon: 'M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z', roles: ['admin'] },
        { id: 'periodos', label: 'Periodos', icon: 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z', roles: ['admin'] },
        { id: 'carga', label: 'Carga Masiva', icon: 'M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12', roles: ['admin'] },
        { id: 'totems', label: 'Tótems', icon: 'M9 17v-2a4 4 0 014-4h6m0 0l-3-3m3 3l-3 3M7 7h.01M7 3h5a2 2 0 012 2v6a2 2 0 01-2 2H7a2 2 0 01-2-2V5a2 2 0 012-2z', roles: ['admin'] },
      ];
      const items = allItems.filter(item => item.roles.includes(user?.role || 'admin'));

      return (
        <div className="w-64 bg-vascan-surface border-r border-white/10 flex flex-col min-h-screen">
          <div className="p-5 border-b border-white/10">
            <div className="flex items-center gap-2">
              <div className="w-9 h-9 rounded-lg overflow-hidden bg-vascan-bg flex-shrink-0">
                <img src="/logo.png" alt="BuenaMezcla" className="w-full h-full object-cover" />
              </div>
              <h2 className="font-bold text-base text-vascan-gold">BuenaMezcla</h2>
            </div>
            <p className="text-xs text-white/40 mt-0.5">{user?.nombre} {user?.apellido}</p>
          </div>
          <nav className="flex-1 p-3 space-y-1">
            {items.map(item => (
              <button key={item.id} onClick={() => onNav(item.id)}
                className={`w-full text-left px-4 py-2.5 rounded-xl text-sm font-medium transition flex items-center gap-3 ${active === item.id ? 'bg-vascan-gold/15 text-vascan-gold' : 'text-white/60 hover:bg-white/5 hover:text-white/80'}`}>
                <svg className="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d={item.icon} /></svg>
                {item.label}
              </button>
            ))}
          </nav>
          <div className="p-3 border-t border-white/10">
            <button onClick={onLogout} className="w-full text-left px-4 py-2.5 rounded-xl text-sm text-red-400 hover:bg-red-500/10 transition flex items-center gap-3">
              <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
              Cerrar sesión
            </button>
          </div>
        </div>
      );
    }

    // ── Dashboard ──
    function DashboardView() {
      const [data, setData] = useState(null);
      const [basicStats, setBasicStats] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        Promise.all([
          apiFetch('/api/dashboard/stats').catch(() => null),
          Promise.all([apiFetch('/api/casinos'), apiFetch('/api/usuarios'), apiFetch('/api/minutas')]).then(([c, u, m]) => ({ casinos: c.length, usuarios: u.length, minutas: m.length }))
        ])
          .then(([dashData, basic]) => { setData(dashData); setBasicStats(basic); })
          .catch(console.error)
          .finally(() => setLoading(false));
      }, []);

      if (loading) return <LoadingSpinner />;

      const dayNames = { 1: 'Lun', 2: 'Mar', 3: 'Mié', 4: 'Jue', 5: 'Vie', 6: 'Sáb', 0: 'Dom' };
      function formatFecha(f) {
        const d = new Date(f + 'T12:00:00');
        const day = dayNames[d.getDay()] || '';
        return `${day} ${d.getDate()}/${d.getMonth()+1}`;
      }

      function getBarColor(pct) {
        if (pct >= 80) return 'bg-green-500';
        if (pct >= 50) return 'bg-yellow-500';
        return 'bg-red-500';
      }

      function getStatusBadge(estado) {
        const map = {
          bueno: { bg: 'bg-green-500/20', text: 'text-green-400', label: 'Bueno' },
          regular: { bg: 'bg-yellow-500/20', text: 'text-yellow-400', label: 'Regular' },
          bajo: { bg: 'bg-red-500/20', text: 'text-red-400', label: 'Bajo' }
        };
        const s = map[estado] || map.bajo;
        return <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${s.bg} ${s.text}`}>{s.label}</span>;
      }

      const resumen = data?.resumen || {};
      const casinoStats = data?.casinos || [];
      const globalPct = resumen.porcentajeGlobal || 0;

      return (
        <div className="fade-in">
          <h1 className="text-2xl font-bold mb-6">Dashboard de Inscripciones</h1>

          <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <StatCard title="Casinos Activos" value={resumen.totalCasinos || basicStats?.casinos || 0} icon="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            <StatCard title="Comensales Registrados" value={resumen.totalComensalesRegistrados || basicStats?.usuarios || 0} icon="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
            <StatCard title="Esperados Hoy" value={resumen.totalEsperados || 0} icon="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
            <div className="bg-vascan-surface rounded-2xl border border-white/10 p-5">
              <div className="flex items-center gap-3 mb-2">
                <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${globalPct >= 80 ? 'bg-green-500/15' : globalPct >= 50 ? 'bg-yellow-500/15' : 'bg-red-500/15'}`}>
                  <svg className={`w-5 h-5 ${globalPct >= 80 ? 'text-green-400' : globalPct >= 50 ? 'text-yellow-400' : 'text-red-400'}`} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                </div>
              </div>
              <p className="text-2xl font-bold">{resumen.totalInscritosHoy || 0} <span className="text-base font-normal text-white/40">/ {resumen.totalEsperados || 0}</span></p>
              <p className="text-white/50 text-sm mt-0.5">Inscritos Hoy — <span className={`font-semibold ${globalPct >= 80 ? 'text-green-400' : globalPct >= 50 ? 'text-yellow-400' : 'text-red-400'}`}>{globalPct}%</span></p>
              <div className="w-full bg-white/10 rounded-full h-2 mt-2">
                <div className={`h-2 rounded-full transition-all ${getBarColor(globalPct)}`} style={{width: `${Math.min(globalPct, 100)}%`}}></div>
              </div>
            </div>
          </div>

          <h2 className="text-lg font-semibold mb-4 text-white/80">Detalle por Casino</h2>
          {casinoStats.length === 0 && (
            <div className="bg-vascan-surface rounded-2xl border border-white/10 p-8 text-center text-white/40">
              <p>No hay casinos activos con comensales diarios configurados.</p>
              <p className="text-sm mt-1">Configure "Comensales Diarios Esperados" en cada casino para ver las métricas.</p>
            </div>
          )}

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
            {casinoStats.map(cs => (
              <div key={cs.casinoId} className="bg-vascan-surface rounded-2xl border border-white/10 p-5">
                <div className="flex items-start justify-between mb-4">
                  <div>
                    <h3 className="font-semibold text-lg">{cs.casinoNombre}</h3>
                    <p className="text-white/40 text-sm">{cs.totalComensales} comensales registrados · {cs.comensalesDiarios} esperados/día</p>
                  </div>
                  {getStatusBadge(cs.estado)}
                </div>

                <div className="grid grid-cols-2 gap-3 mb-4">
                  <div className="bg-white/5 rounded-xl p-3">
                    <p className="text-xs text-white/40 mb-1">Inscritos Hoy</p>
                    <p className="text-xl font-bold">{cs.inscritosHoy} <span className="text-sm font-normal text-white/40">/ {cs.comensalesDiarios}</span></p>
                    <div className="w-full bg-white/10 rounded-full h-1.5 mt-2">
                      <div className={`h-1.5 rounded-full transition-all ${getBarColor(cs.porcentajeHoy)}`} style={{width: `${Math.min(cs.porcentajeHoy, 100)}%`}}></div>
                    </div>
                    <p className={`text-xs mt-1 font-semibold ${cs.porcentajeHoy >= 80 ? 'text-green-400' : cs.porcentajeHoy >= 50 ? 'text-yellow-400' : 'text-red-400'}`}>{cs.porcentajeHoy}%</p>
                  </div>
                  <div className="bg-white/5 rounded-xl p-3">
                    <p className="text-xs text-white/40 mb-1">Inscritos Semana</p>
                    <p className="text-xl font-bold">{cs.inscritosSemana} <span className="text-sm font-normal text-white/40">/ {cs.comensalesDiarios}</span></p>
                    <div className="w-full bg-white/10 rounded-full h-1.5 mt-2">
                      <div className={`h-1.5 rounded-full transition-all ${getBarColor(cs.porcentajeSemana)}`} style={{width: `${Math.min(cs.porcentajeSemana, 100)}%`}}></div>
                    </div>
                    <p className={`text-xs mt-1 font-semibold ${cs.porcentajeSemana >= 80 ? 'text-green-400' : cs.porcentajeSemana >= 50 ? 'text-yellow-400' : 'text-red-400'}`}>{cs.porcentajeSemana}%</p>
                  </div>
                </div>

                {cs.dailyBreakdown.length > 0 && (
                  <div>
                    <p className="text-xs text-white/40 mb-2 font-medium">Desglose diario esta semana</p>
                    <div className="flex items-end gap-1 h-20">
                      {cs.dailyBreakdown.map(day => (
                        <div key={day.fecha} className="flex-1 flex flex-col items-center gap-1">
                          <span className="text-[10px] text-white/50 font-semibold">{day.inscritos}</span>
                          <div className="w-full bg-white/10 rounded-sm relative" style={{height: '48px'}}>
                            <div className={`absolute bottom-0 w-full rounded-sm transition-all ${getBarColor(day.porcentaje)}`} style={{height: `${Math.min(day.porcentaje, 100)}%`}}></div>
                          </div>
                          <span className="text-[9px] text-white/30">{formatFecha(day.fecha)}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {cs.dailyBreakdown.length === 0 && (
                  <p className="text-xs text-white/30 text-center py-2">Sin minutas activas esta semana</p>
                )}
              </div>
            ))}
          </div>

          <h2 className="text-lg font-semibold mb-4 text-white/80">Resumen General</h2>
          <div className="bg-vascan-surface rounded-2xl border border-white/10 overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="border-b border-white/10 text-white/50">
                    <th className="text-left px-5 py-3">Casino</th>
                    <th className="text-center px-5 py-3">Registrados</th>
                    <th className="text-center px-5 py-3">Esperados/Día</th>
                    <th className="text-center px-5 py-3">Inscritos Hoy</th>
                    <th className="text-center px-5 py-3">% Hoy</th>
                    <th className="text-center px-5 py-3">Inscritos Semana</th>
                    <th className="text-center px-5 py-3">Estado</th>
                  </tr>
                </thead>
                <tbody>
                  {casinoStats.map(cs => (
                    <tr key={cs.casinoId} className="border-b border-white/5 hover:bg-white/[0.02]">
                      <td className="px-5 py-3 font-medium">{cs.casinoNombre}</td>
                      <td className="px-5 py-3 text-center text-white/70">{cs.totalComensales}</td>
                      <td className="px-5 py-3 text-center text-white/70">{cs.comensalesDiarios}</td>
                      <td className="px-5 py-3 text-center font-semibold">{cs.inscritosHoy}</td>
                      <td className="px-5 py-3 text-center">
                        <span className={`font-semibold ${cs.porcentajeHoy >= 80 ? 'text-green-400' : cs.porcentajeHoy >= 50 ? 'text-yellow-400' : 'text-red-400'}`}>{cs.porcentajeHoy}%</span>
                      </td>
                      <td className="px-5 py-3 text-center text-white/70">{cs.inscritosSemana}</td>
                      <td className="px-5 py-3 text-center">{getStatusBadge(cs.estado)}</td>
                    </tr>
                  ))}
                  {casinoStats.length > 1 && (
                    <tr className="border-t border-white/20 bg-white/[0.03] font-semibold">
                      <td className="px-5 py-3">TOTAL</td>
                      <td className="px-5 py-3 text-center">{resumen.totalComensalesRegistrados}</td>
                      <td className="px-5 py-3 text-center">{resumen.totalEsperados}</td>
                      <td className="px-5 py-3 text-center">{resumen.totalInscritosHoy}</td>
                      <td className="px-5 py-3 text-center">
                        <span className={`${globalPct >= 80 ? 'text-green-400' : globalPct >= 50 ? 'text-yellow-400' : 'text-red-400'}`}>{globalPct}%</span>
                      </td>
                      <td className="px-5 py-3 text-center">—</td>
                      <td className="px-5 py-3 text-center">—</td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function StatCard({ title, value, icon, color, bgColor }) {
      return (
        <div className="bg-vascan-surface rounded-2xl border border-white/10 p-5">
          <div className="flex items-center gap-3 mb-2">
            <div className={`w-10 h-10 rounded-xl ${bgColor || 'bg-vascan-gold/15'} flex items-center justify-center`}>
              <svg className={`w-5 h-5 ${color || 'text-vascan-gold'}`} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d={icon} /></svg>
            </div>
          </div>
          <p className="text-2xl font-bold">{value}</p>
          <p className="text-white/50 text-sm mt-0.5">{title}</p>
        </div>
      );
    }

    // ── Usuarios CRUD ──
    function UsuariosView({ user: currentUser } = {}) {
      const readOnly = currentUser?.role !== 'admin';
      const [users, setUsers] = useState([]);
      const [casinos, setCasinos] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [editUser, setEditUser] = useState(null);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [toast, setToast] = useState(null);
      const [search, setSearch] = useState('');

      const [form, setForm] = useState({ rut: '', nombre: '', apellido: '', telefono: '', role: 'comensal', casinoId: '', casinoIds: [], fechaNacimiento: '', password: '' });
      const [filterCasino, setFilterCasino] = useState('all');

      useEffect(() => { loadData(); }, []);

      async function loadData() {
        setLoading(true);
        try {
          const [u, c] = await Promise.all([apiFetch('/api/usuarios'), apiFetch('/api/casinos')]);
          setUsers(u);
          setCasinos(c);
        } catch (e) { console.error(e); }
        setLoading(false);
      }

      function openCreate() {
        setEditUser(null);
        setForm({ rut: '', nombre: '', apellido: '', telefono: '', role: 'comensal', casinoId: '', casinoIds: [], fechaNacimiento: '', password: '' });
        setShowModal(true);
      }

      function openEdit(u) {
        setEditUser(u);
        setForm({ rut: u.rut, nombre: u.nombre, apellido: u.apellido, telefono: u.telefono || '', role: u.role, casinoId: u.casinoId || '', casinoIds: u.casinoIds || [], fechaNacimiento: u.fechaNacimiento || '', password: '' });
        setShowModal(true);
      }

      async function handleSave(e) {
        e.preventDefault();
        try {
          const isMulti = form.role === 'interlocutor' || form.role === 'encargado_casino';
          if (editUser) {
            const body = { nombre: form.nombre, apellido: form.apellido, telefono: form.telefono || null, role: form.role, casinoId: form.casinoId || null, fechaNacimiento: form.fechaNacimiento || null };
            if (isMulti) body.casinoIds = form.casinoIds;
            if (form.password) body.password = form.password;
            await apiFetch(`/api/usuarios/${editUser.id}`, { method: 'PUT', body: JSON.stringify(body) });
            setToast({ message: 'Usuario actualizado', type: 'success' });
          } else {
            const rutLimpio = cleanRut(form.rut);
            if (looksLikeRut(rutLimpio) && !validarRutChileno(rutLimpio)) {
              setToast({ message: 'El RUT ingresado no es válido. Verifique el dígito verificador.', type: 'error' });
              return;
            }
            const payload = { ...form, rut: rutLimpio, fechaNacimiento: form.fechaNacimiento || null };
            if (!isMulti) delete payload.casinoIds;
            await apiFetch('/api/usuarios', { method: 'POST', body: JSON.stringify(payload) });
            setToast({ message: 'Usuario creado', type: 'success' });
          }
          setShowModal(false);
          loadData();
        } catch (err) {
          setToast({ message: err.message, type: 'error' });
        }
      }

      async function handleDelete() {
        try {
          await apiFetch(`/api/usuarios/${deleteTarget.id}`, { method: 'DELETE' });
          setToast({ message: 'Usuario eliminado', type: 'success' });
          setDeleteTarget(null);
          loadData();
        } catch (err) {
          setToast({ message: err.message, type: 'error' });
        }
      }

      async function toggleActive(u) {
        try {
          await apiFetch(`/api/usuarios/${u.id}`, { method: 'PUT', body: JSON.stringify({ activo: !u.activo }) });
          loadData();
        } catch (err) {
          setToast({ message: err.message, type: 'error' });
        }
      }

      const filtered = users.filter(u => {
        const txt = (u.nombre + ' ' + u.apellido + ' ' + u.rut).toLowerCase();
        if (search && !txt.includes(search.toLowerCase())) return false;
        if (filterCasino && filterCasino !== 'all') {
          const ids = [u.casinoId, ...(u.casinoIds || [])].filter(Boolean);
          if (!ids.includes(filterCasino)) return false;
        }
        return true;
      });

      const roleLabels = { admin: 'Admin', comensal: 'Comensal', interlocutor: 'Interlocutor', encargado_casino: 'Encargado' };
      const roleBadge = { admin: 'bg-purple-500/20 text-purple-400', comensal: 'bg-blue-500/20 text-blue-400', interlocutor: 'bg-vascan-gold/20 text-vascan-gold', encargado_casino: 'bg-emerald-500/20 text-emerald-400' };

      if (loading) return <LoadingSpinner />;

      return (
        <div className="fade-in">
          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

          <div className="flex items-center justify-between mb-6">
            <div>
              <h1 className="text-2xl font-bold">Usuarios</h1>
              {readOnly && <p className="text-xs text-white/40 mt-1">Vista de solo lectura</p>}
            </div>
            {!readOnly && (
              <button onClick={openCreate} className="bg-vascan-gold hover:bg-vascan-goldDark text-white font-semibold px-5 py-2.5 rounded-xl transition text-sm flex items-center gap-2">
                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>
                Nuevo Usuario
              </button>
            )}
          </div>

          <div className="bg-vascan-surface rounded-2xl border border-white/10 overflow-hidden">
            <div className="p-4 border-b border-white/10 flex flex-col md:flex-row gap-3">
              <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Buscar por nombre, apellido o RUT..."
                className="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white placeholder-white/30 focus:outline-none focus:border-vascan-gold/50 transition text-sm" />
              {/* Interlocutor: el backend ya filtra a sus casinos asignados;
                  ocultamos el desplegable para no inducir a creer que puede
                  ver el resto de los casinos. */}
              {currentUser?.role !== 'interlocutor' && (
                <select value={filterCasino} onChange={e => setFilterCasino(e.target.value)}
                  className="bg-vascan-dark border border-white/10 text-white rounded-xl px-4 py-2.5 text-sm" style={{colorScheme:'dark'}}>
                  <option value="all">Todos los casinos</option>
                  {casinos.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
                </select>
              )}
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="border-b border-white/10 text-white/50">
                    <th className="text-left px-5 py-3">RUT</th>
                    <th className="text-left px-5 py-3">Nombre</th>
                    <th className="text-left px-5 py-3">Teléfono</th>
                    <th className="text-left px-5 py-3">Rol</th>
                    <th className="text-left px-5 py-3">Casino</th>
                    <th className="text-center px-5 py-3">Estado</th>
                    <th className="text-right px-5 py-3">Acciones</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map(u => {
                    const casino = casinos.find(c => c.id === u.casinoId);
                    return (
                      <tr key={u.id} className="border-b border-white/5 hover:bg-white/[0.02]">
                        <td className="px-5 py-3 font-mono text-white/70">{u.rut}</td>
                        <td className="px-5 py-3">{u.nombre} {u.apellido}</td>
                        <td className="px-5 py-3 text-white/50 text-xs">{u.telefono || '—'}</td>
                        <td className="px-5 py-3">
                          <span className={`px-2.5 py-1 rounded-full text-xs font-medium ${roleBadge[u.role]}`}>{roleLabels[u.role]}</span>
                        </td>
                        <td className="px-5 py-3 text-white/50">{casino?.nombre || '—'}</td>
                        <td className="px-5 py-3 text-center">
                          {readOnly ? (
                            <span className={`inline-block w-2 h-2 rounded-full ${u.activo ? 'bg-green-500' : 'bg-white/20'}`}></span>
                          ) : (
                            <button onClick={() => toggleActive(u)} className={`w-10 h-5 rounded-full transition relative ${u.activo ? 'bg-green-500' : 'bg-white/20'}`}>
                              <span className={`absolute top-0.5 w-4 h-4 rounded-full bg-white transition-all ${u.activo ? 'left-5' : 'left-0.5'}`}></span>
                            </button>
                          )}
                        </td>
                        <td className="px-5 py-3 text-right">
                          {readOnly ? (
                            <span className="text-xs text-white/30">—</span>
                          ) : (
                            <div className="flex items-center justify-end gap-2">
                              <button onClick={() => openEdit(u)} className="p-1.5 rounded-lg hover:bg-white/10 text-white/50 hover:text-white transition" title="Editar">
                                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                              </button>
                              <button onClick={() => setDeleteTarget(u)} className="p-1.5 rounded-lg hover:bg-red-500/10 text-white/50 hover:text-red-400 transition" title="Eliminar">
                                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                              </button>
                            </div>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                  {filtered.length === 0 && (
                    <tr><td colSpan={6} className="px-5 py-8 text-center text-white/40">No se encontraron usuarios</td></tr>
                  )}
                </tbody>
              </table>
            </div>
            <div className="px-5 py-3 border-t border-white/10 text-sm text-white/40">
              {filtered.length} de {users.length} usuarios
            </div>
          </div>

          <Modal open={showModal} onClose={() => setShowModal(false)} title={editUser ? 'Editar Usuario' : 'Nuevo Usuario'}>
            <form onSubmit={handleSave} className="space-y-4">
              {!editUser && <InputField label="RUT" value={form.rut} onChange={v => setForm({...form, rut: formatRutInput(v)})} placeholder="12.345.678-9" required />}
              {editUser && <div><label className="block text-sm font-medium text-white/70 mb-1.5">RUT</label><p className="text-white/50 font-mono">{form.rut}</p></div>}
              <div className="grid grid-cols-2 gap-4">
                <InputField label="Nombre" value={form.nombre} onChange={v => setForm({...form, nombre: v})} required />
                <InputField label="Apellido" value={form.apellido} onChange={v => setForm({...form, apellido: v})} required />
              </div>
              <InputField label="Teléfono" value={form.telefono} onChange={v => setForm({...form, telefono: v})} placeholder="+56912345678" />
              <div className="grid grid-cols-2 gap-4">
                <SelectField label="Rol" value={form.role} onChange={v => setForm({...form, role: v})}
                  options={[{ value: 'comensal', label: 'Comensal' }, { value: 'encargado_casino', label: 'Encargado de Casino' }, { value: 'interlocutor', label: 'Interlocutor (multi-casino)' }, { value: 'admin', label: 'Admin' }]} />
                <InputField label="Fecha de nacimiento" value={form.fechaNacimiento} onChange={v => setForm({...form, fechaNacimiento: v})} type="date" />
              </div>
              <SelectField label="Casino principal" value={form.casinoId} onChange={v => setForm({...form, casinoId: v})}
                options={[{ value: '', label: 'Sin casino asignado' }, ...casinos.map(c => ({ value: c.id, label: c.nombre }))]} />
              {(form.role === 'interlocutor' || form.role === 'encargado_casino') && (
                <div>
                  <label className="block text-sm font-medium text-white/70 mb-1.5">Casinos adicionales accesibles</label>
                  <p className="text-xs text-white/40 mb-2">El usuario podrá ver datos de estos casinos además del principal.</p>
                  <div className="space-y-1.5 max-h-40 overflow-y-auto bg-white/5 rounded-xl p-3 border border-white/10">
                    {casinos.map(c => (
                      <label key={c.id} className="flex items-center gap-3 cursor-pointer hover:bg-white/5 rounded-lg px-2 py-1 transition">
                        <input type="checkbox" checked={form.casinoIds.includes(c.id)} onChange={() => setForm(f => ({...f, casinoIds: f.casinoIds.includes(c.id) ? f.casinoIds.filter(x=>x!==c.id) : [...f.casinoIds, c.id]}))}
                          className="w-4 h-4 rounded accent-amber-500" />
                        <span className="text-sm text-white/80">{c.nombre}</span>
                      </label>
                    ))}
                  </div>
                </div>
              )}
              <InputField label={editUser ? 'Nueva contraseña (vacío = no cambiar; al cambiar, se forzará nuevo cambio en próximo login)' : 'Contraseña (vacío = primeros 4 dígitos del RUT). Se forzará cambio en primer login.'}
                value={form.password} onChange={v => setForm({...form, password: v})} type="password" />
              <div className="flex justify-end gap-3 pt-2">
                <button type="button" onClick={() => setShowModal(false)} className="px-5 py-2.5 rounded-xl bg-white/10 hover:bg-white/15 text-sm font-medium transition">Cancelar</button>
                <button type="submit" className="px-5 py-2.5 rounded-xl bg-vascan-gold hover:bg-vascan-goldDark text-sm font-medium transition">
                  {editUser ? 'Guardar Cambios' : 'Crear Usuario'}
                </button>
              </div>
            </form>
          </Modal>

          <ConfirmDialog open={!!deleteTarget} onClose={() => setDeleteTarget(null)} onConfirm={handleDelete}
            message={`¿Eliminar al usuario ${deleteTarget?.nombre} ${deleteTarget?.apellido} (${deleteTarget?.rut})?`} />
        </div>
      );
    }

    // ── Casinos CRUD ──
    function CasinosView() {
      const [casinosList, setCasinosList] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [editItem, setEditItem] = useState(null);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [toast, setToast] = useState(null);
      const [form, setForm] = useState({ nombre: '', direccion: '', comensalesDiarios: 0, permitirCambioClaveTotem: false });

      useEffect(() => { loadData(); }, []);

      async function loadData() {
        setLoading(true);
        try {
          const data = await apiFetch('/api/casinos/all');
          setCasinosList(data);
        } catch (e) { console.error(e); }
        setLoading(false);
      }

      function openCreate() {
        setEditItem(null);
        setForm({ nombre: '', direccion: '', comensalesDiarios: 0, permitirCambioClaveTotem: false });
        setShowModal(true);
      }

      function openEdit(c) {
        setEditItem(c);
        setForm({ nombre: c.nombre, direccion: c.direccion || '', comensalesDiarios: c.comensalesDiarios || 0, permitirCambioClaveTotem: !!c.permitirCambioClaveTotem });
        setShowModal(true);
      }

      async function handleSave(e) {
        e.preventDefault();
        try {
          if (editItem) {
            await apiFetch(`/api/casinos/${editItem.id}`, { method: 'PUT', body: JSON.stringify(form) });
            setToast({ message: 'Casino actualizado', type: 'success' });
          } else {
            await apiFetch('/api/casinos', { method: 'POST', body: JSON.stringify(form) });
            setToast({ message: 'Casino creado', type: 'success' });
          }
          setShowModal(false);
          loadData();
        } catch (err) {
          setToast({ message: err.message, type: 'error' });
        }
      }

      async function handleDelete() {
        try {
          const historyRes = await apiFetch(`/api/casinos/${deleteTarget.id}/has-history`);
          if (historyRes.hasHistory) {
            await apiFetch(`/api/casinos/${deleteTarget.id}`, { method: 'DELETE' });
            setToast({ message: `Casino desactivado (tiene ${historyRes.minutas} minutas y ${historyRes.usuarios} usuarios asociados)`, type: 'success' });
          } else {
            await apiFetch(`/api/casinos/${deleteTarget.id}`, { method: 'DELETE' });
            setToast({ message: 'Casino eliminado permanentemente', type: 'success' });
          }
          setDeleteTarget(null);
          loadData();
        } catch (err) {
          setToast({ message: err.message, type: 'error' });
        }
      }

      async function toggleActive(c) {
        try {
          await apiFetch(`/api/casinos/${c.id}`, { method: 'PUT', body: JSON.stringify({ activo: !c.activo }) });
          loadData();
        } catch (err) {
          setToast({ message: err.message, type: 'error' });
        }
      }

      if (loading) return <LoadingSpinner />;

      return (
        <div className="fade-in">
          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

          <div className="flex items-center justify-between mb-6">
            <h1 className="text-2xl font-bold">Casinos</h1>
            <button onClick={openCreate} className="bg-vascan-gold hover:bg-vascan-goldDark text-white font-semibold px-5 py-2.5 rounded-xl transition text-sm flex items-center gap-2">
              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>
              Nuevo Casino
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {casinosList.map(c => (
              <div key={c.id} className={`bg-vascan-surface rounded-2xl border p-5 ${c.activo ? 'border-white/10' : 'border-red-500/20 opacity-60'}`}>
                <div className="flex items-start justify-between mb-3">
                  <div>
                    <h3 className="font-semibold text-lg">{c.nombre}</h3>
                    <p className="text-white/40 text-sm mt-0.5">{c.direccion || 'Sin dirección'}</p>
                    {c.comensalesDiarios > 0 && (
                      <p className="text-vascan-gold/70 text-xs mt-1 font-medium">👥 {c.comensalesDiarios} comensales diarios esperados</p>
                    )}
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => toggleActive(c)} className={`px-2.5 py-1 rounded-full text-xs font-medium ${c.activo ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}`}>
                      {c.activo ? 'Activo' : 'Inactivo'}
                    </button>
                  </div>
                </div>
                <div className="flex items-center gap-2 mt-3 pt-3 border-t border-white/5">
                  <button onClick={() => openEdit(c)} className="text-xs text-white/50 hover:text-vascan-gold transition flex items-center gap-1">
                    <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                    Editar
                  </button>
                  {c.activo && (
                    <button onClick={() => toggleActive(c)} className="text-xs text-white/50 hover:text-yellow-400 transition flex items-center gap-1">
                      <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>
                      Desactivar
                    </button>
                  )}
                  {!c.activo && (
                    <button onClick={() => toggleActive(c)} className="text-xs text-white/50 hover:text-green-400 transition flex items-center gap-1">
                      <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                      Reactivar
                    </button>
                  )}
                  <button onClick={() => setDeleteTarget(c)} className="text-xs text-white/50 hover:text-red-400 transition flex items-center gap-1">
                    <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    Eliminar
                  </button>
                </div>
              </div>
            ))}
          </div>

          <Modal open={showModal} onClose={() => setShowModal(false)} title={editItem ? 'Editar Casino' : 'Nuevo Casino'}>
            <form onSubmit={handleSave} className="space-y-4">
              <InputField label="Nombre" value={form.nombre} onChange={v => setForm({...form, nombre: v})} placeholder="Casino Central" required />
              <InputField label="Dirección" value={form.direccion} onChange={v => setForm({...form, direccion: v})} placeholder="Av. Principal 123" />
              <InputField label="Comensales Diarios Esperados" value={form.comensalesDiarios} onChange={v => setForm({...form, comensalesDiarios: parseInt(v) || 0})} type="number" placeholder="Ej: 180" />
              <label className="flex items-start gap-3 p-3 bg-white/5 border border-white/10 rounded-xl cursor-pointer hover:bg-white/8">
                <input type="checkbox" checked={form.permitirCambioClaveTotem} onChange={e => setForm({...form, permitirCambioClaveTotem: e.target.checked})} className="mt-0.5 w-4 h-4 accent-amber-500" />
                <div>
                  <p className="text-sm font-medium text-white">Permitir cambio de clave en el tótem</p>
                  <p className="text-xs text-white/50 mt-0.5">Si está activo, los comensales podrán cambiar su clave en el primer ingreso por el tótem. Si no, deberán cambiarla en el panel web.</p>
                </div>
              </label>
              <div className="flex justify-end gap-3 pt-2">
                <button type="button" onClick={() => setShowModal(false)} className="px-5 py-2.5 rounded-xl bg-white/10 hover:bg-white/15 text-sm font-medium transition">Cancelar</button>
                <button type="submit" className="px-5 py-2.5 rounded-xl bg-vascan-gold hover:bg-vascan-goldDark text-sm font-medium transition">
                  {editItem ? 'Guardar Cambios' : 'Crear Casino'}
                </button>
              </div>
            </form>
          </Modal>

          <ConfirmDialog open={!!deleteTarget} onClose={() => setDeleteTarget(null)} onConfirm={handleDelete}
            message={`¿Eliminar el casino "${deleteTarget?.nombre}"? Si tiene minutas o usuarios asociados será desactivado en vez de eliminado.`} />
        </div>
      );
    }

    // ── Minutas CRUD ──
    function hexToFamiliaBadge(hex) {
      return `border-[${hex}50] text-[${hex}] bg-[${hex}15]`;
    }
    function getFamiliaLabel(val, familiasList) {
      if (!familiasList) return val;
      const found = familiasList.find(f => f.nombre.toLowerCase() === val?.toLowerCase() || f.nombre === val);
      return found ? found.nombre : val || 'N/A';
    }
    function getFamiliaColor(val, familiasList) {
      if (!familiasList) return 'bg-white/10 text-white/60 border-white/20';
      const found = familiasList.find(f => f.nombre.toLowerCase() === val?.toLowerCase() || f.nombre === val);
      if (!found) return 'bg-white/10 text-white/60 border-white/20';
      const presets = {
        'Almuerzo': 'bg-amber-500/20 text-amber-300 border-amber-500/30',
        'Desayuno': 'bg-sky-500/20 text-sky-300 border-sky-500/30',
        'Colación': 'bg-green-500/20 text-green-300 border-green-500/30',
        'Almuerzo Fin de Semana': 'bg-purple-500/20 text-purple-300 border-purple-500/30',
        'Cena': 'bg-indigo-500/20 text-indigo-300 border-indigo-500/30',
        'Once': 'bg-rose-500/20 text-rose-300 border-rose-500/30',
      };
      return presets[found.nombre] || 'bg-white/10 text-white/60 border-white/20';
    }

    function MinutasView({ user }) {
      const [casinos, setCasinos] = useState([]);
      const [selectedCasino, setSelectedCasino] = useState('');
      const [filterFamilia, setFilterFamilia] = useState('');
      const [familiasList, setFamiliasList] = useState([]);
      const [minutasList, setMinutasList] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [showCloneModal, setShowCloneModal] = useState(false);
      const [cloneSource, setCloneSource] = useState(null);
      const [cloneForm, setCloneForm] = useState({ fecha: '', casinoIds: [] });
      const [editItem, setEditItem] = useState(null);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [toast, setToast] = useState(null);
      const [form, setForm] = useState({ fecha: '', familia: 'almuerzo', opcion1: '', opcion2: '', opcion3: '', opcion4: '', opcion5: '', casinoIds: [], editCasinoId: '' });

      useEffect(() => {
        Promise.all([apiFetch('/api/casinos'), apiFetch('/api/familias')]).then(([casinoData, famData]) => {
          // Interlocutor ve sólo los casinos de su responsabilidad (casinoIds expuestos
          // por /api/auth/me). Por defecto carga TODAS las minutas de esos casinos
          // ('' = todos los casinos accesibles) — el backend ya filtra por permisos.
          if (user?.role === 'interlocutor') {
            const myIds = new Set([...(user.casinoIds || []), user.casinoId].filter(Boolean));
            setCasinos(casinoData.filter(c => myIds.has(c.id)));
          } else {
            setCasinos(casinoData);
          }
          setFamiliasList(famData.filter(f => f.activo));
          loadMinutas('');
        });
      }, []);

      async function loadMinutas(casinoId) {
        setLoading(true);
        try {
          const data = casinoId
            ? await apiFetch(`/api/minutas/${casinoId}?all=true`)
            : await apiFetch('/api/minutas');
          setMinutasList(data.sort((a, b) => b.fecha.localeCompare(a.fecha)));
        } catch (e) { console.error(e); }
        setLoading(false);
      }

      function handleCasinoChange(id) {
        setSelectedCasino(id);
        loadMinutas(id);
      }

      function openCreate() {
        setEditItem(null);
        const defaultFamilia = familiasList.length > 0 ? familiasList[0].nombre : 'Almuerzo';
        const defaultCasinoIds = selectedCasino ? [selectedCasino] : casinos.map(c => c.id);
        setForm({ fecha: new Date().toISOString().split('T')[0], familia: defaultFamilia, opcion1: '', opcion2: '', opcion3: '', opcion4: '', opcion5: '', casinoIds: defaultCasinoIds, editCasinoId: '' });
        setShowModal(true);
      }

      function openEdit(m) {
        setEditItem(m);
        setForm({ fecha: m.fecha, familia: m.familia || 'Almuerzo', opcion1: m.opcion1, opcion2: m.opcion2, opcion3: m.opcion3, opcion4: m.opcion4 || '', opcion5: m.opcion5 || '', casinoIds: [m.casinoId], editCasinoId: m.casinoId });
        setShowModal(true);
      }

      const [collapsedMonths, setCollapsedMonths] = useState({});
      function toggleMonth(key) {
        setCollapsedMonths(prev => ({ ...prev, [key]: !prev[key] }));
      }

      function openClone(m) {
        setCloneSource(m);
        setCloneForm({ fecha: '', casinoIds: [m.casinoId] });
        setShowCloneModal(true);
      }

      function toggleCasinoInList(list, id) {
        return list.includes(id) ? list.filter(x => x !== id) : [...list, id];
      }

      async function handleSave(e) {
        e.preventDefault();
        try {
          if (editItem) {
            if (form.casinoIds.length === 0) {
              setToast({ message: 'Seleccione al menos un casino', type: 'error' });
              return;
            }
            const body = { ...form, opcion4: form.opcion4 || null, opcion5: form.opcion5 || null, replicateToCasinoIds: form.casinoIds.filter(cid => cid !== editItem.casinoId) };
            delete body.editCasinoId;
            delete body.casinoIds;
            await apiFetch(`/api/minutas/${editItem.id}`, { method: 'PUT', body: JSON.stringify(body) });
            const extras = form.casinoIds.filter(cid => cid !== editItem.casinoId).length;
            setToast({ message: extras > 0 ? `Minuta actualizada y replicada a ${extras} casino(s)` : 'Minuta actualizada', type: 'success' });
          } else {
            if (form.casinoIds.length === 0) {
              setToast({ message: 'Seleccione al menos un casino', type: 'error' });
              return;
            }
            const body = { ...form, opcion4: form.opcion4 || null, opcion5: form.opcion5 || null };
            await apiFetch('/api/minutas', { method: 'POST', body: JSON.stringify(body) });
            setToast({ message: `Minuta creada en ${form.casinoIds.length} casino(s)`, type: 'success' });
          }
          setShowModal(false);
          loadMinutas(selectedCasino);
        } catch (err) {
          setToast({ message: err.message, type: 'error' });
        }
      }

      async function handleClone(e) {
        e.preventDefault();
        if (!cloneSource) return;
        if (cloneForm.casinoIds.length === 0) {
          setToast({ message: 'Seleccione al menos un casino destino', type: 'error' });
          return;
        }
        try {
          const body = { fecha: cloneForm.fecha || null, casinoIds: cloneForm.casinoIds };
          await apiFetch(`/api/minutas/${cloneSource.id}/clonar`, { method: 'POST', body: JSON.stringify(body) });
          setToast({ message: `Minuta clonada en ${cloneForm.casinoIds.length} casino(s)`, type: 'success' });
          setShowCloneModal(false);
          loadMinutas(selectedCasino);
        } catch (err) {
          setToast({ message: err.message, type: 'error' });
        }
      }

      async function handleDelete() {
        try {
          await apiFetch(`/api/minutas/${deleteTarget.id}`, { method: 'DELETE' });
          setToast({ message: 'Minuta desactivada', type: 'success' });
          setDeleteTarget(null);
          loadMinutas(selectedCasino);
        } catch (err) {
          setToast({ message: err.message, type: 'error' });
        }
      }

      async function toggleMinutaActivo(m) {
        try {
          await apiFetch(`/api/minutas/${m.id}`, { method: 'PUT', body: JSON.stringify({ activo: !m.activo }) });
          setToast({ message: m.activo ? 'Minuta desactivada' : 'Minuta activada', type: 'success' });
          loadMinutas(selectedCasino);
        } catch (err) {
          setToast({ message: err.message, type: 'error' });
        }
      }

      async function batchToggleWeek(weekMinutas, newActivo) {
        try {
          const ids = weekMinutas.map(m => m.id);
          await apiFetch('/api/minutas/batch-toggle', { method: 'POST', body: JSON.stringify({ ids, activo: newActivo }) });
          setToast({ message: `${ids.length} minutas ${newActivo ? 'activadas' : 'desactivadas'}`, type: 'success' });
          loadMinutas(selectedCasino);
        } catch (err) {
          setToast({ message: err.message, type: 'error' });
        }
      }

      function getMonthKey(dateStr) {
        return dateStr.slice(0, 7);
      }
      const MONTH_NAMES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      function getMonthLabel(key) {
        const [y, m] = key.split('-');
        return `${MONTH_NAMES[parseInt(m) - 1]} ${y}`;
      }
      function groupByMonth(minutas) {
        const groups = {};
        minutas.forEach(m => {
          const key = getMonthKey(m.fecha);
          if (!groups[key]) groups[key] = [];
          groups[key].push(m);
        });
        // Newest month first; minutas inside also newest first
        return Object.entries(groups).sort((a, b) => b[0].localeCompare(a[0]))
          .map(([k, list]) => [k, list.sort((a, b) => b.fecha.localeCompare(a.fecha))]);
      }

      const DAYS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
      const filtered = filterFamilia ? minutasList.filter(m => (m.familia || '').toLowerCase() === filterFamilia.toLowerCase()) : minutasList;
      const weekGroups = groupByMonth(filtered);

      if (loading && casinos.length === 0) return <LoadingSpinner />;

      return (
        <div className="fade-in">
          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

          <div className="flex items-center justify-between mb-6">
            <h1 className="text-2xl font-bold">Minutas</h1>
            {user?.role !== 'interlocutor' && (
              <button onClick={openCreate} className="bg-vascan-gold hover:bg-vascan-goldDark text-white font-semibold px-5 py-2.5 rounded-xl transition text-sm flex items-center gap-2">
                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>
                Nueva Minuta
              </button>
            )}
          </div>

          <div className="bg-vascan-surface rounded-2xl border border-white/10 p-4 mb-6">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {/* Selector de casino. Para interlocutor la lista `casinos` ya viene
                  filtrada a sus casinos asignados (ver useEffect inicial), de modo
                  que "Todos los casinos" muestra TODAS las minutas de los casinos
                  de su responsabilidad. Si sólo tiene uno, mostramos sólo el nombre. */}
              {user?.role === 'interlocutor' && casinos.length <= 1 ? (
                <div className="flex items-center gap-2 px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white/60 text-sm">
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5" /></svg>
                  {casinos[0]?.nombre || 'Mi casino'}
                </div>
              ) : (
                <select value={selectedCasino} onChange={e => handleCasinoChange(e.target.value)}
                  className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-vascan-gold/50 transition text-sm" style={{colorScheme: 'dark'}}>
                  <option value="">{user?.role === 'interlocutor' ? 'Todos mis casinos' : 'Todos los casinos'}</option>
                  {casinos.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
                </select>
              )}
              <select value={filterFamilia} onChange={e => setFilterFamilia(e.target.value)}
                className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-vascan-gold/50 transition text-sm" style={{colorScheme: 'dark'}}>
                <option value="">Todas las familias</option>
                {familiasList.map(f => <option key={f.id} value={f.nombre}>{f.nombre}</option>)}
              </select>
            </div>
          </div>

          {loading ? <LoadingSpinner /> : weekGroups.length === 0 ? (
            <div className="text-center py-12 text-white/40">No hay minutas para este filtro</div>
          ) : (
            <div className="space-y-6">
              {weekGroups.map(([weekKey, weekMinutas]) => {
                const allActive = weekMinutas.every(m => m.activo);
                const someActive = weekMinutas.some(m => m.activo);
                const isCollapsed = !!collapsedMonths[weekKey];
                return (
                  <div key={weekKey} className={`bg-vascan-surface rounded-2xl border ${allActive ? 'border-green-500/30' : someActive ? 'border-yellow-500/20' : 'border-white/10'} overflow-hidden`}>
                    <div className="flex items-center justify-between px-5 py-3 border-b border-white/10 bg-white/[0.02]">
                      <button onClick={() => toggleMonth(weekKey)} className="flex items-center gap-3 flex-1 text-left hover:opacity-80 transition">
                        <svg className={`w-4 h-4 text-white/40 transition-transform ${isCollapsed ? '' : 'rotate-90'}`} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>
                        <div>
                          <p className="text-sm font-semibold text-white">{getMonthLabel(weekKey)}</p>
                          <p className="text-xs text-white/40">{weekMinutas.length} minutas</p>
                        </div>
                        {allActive && <span className="px-2 py-0.5 bg-green-500/20 text-green-400 text-xs font-medium rounded-full">ACTIVA</span>}
                        {!allActive && someActive && <span className="px-2 py-0.5 bg-yellow-500/20 text-yellow-400 text-xs font-medium rounded-full">PARCIAL</span>}
                        {!someActive && <span className="px-2 py-0.5 bg-white/10 text-white/40 text-xs font-medium rounded-full">INACTIVA</span>}
                      </button>
                      <div className="flex items-center gap-2">
                        {!allActive && user?.role !== 'interlocutor' && (
                          <button onClick={() => batchToggleWeek(weekMinutas, true)}
                            className="px-3 py-1.5 bg-green-500/15 text-green-400 text-xs font-medium rounded-lg hover:bg-green-500/25 transition flex items-center gap-1">
                            <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
                            Activar Mes
                          </button>
                        )}
                        {someActive && user?.role !== 'interlocutor' && (
                          <button onClick={() => batchToggleWeek(weekMinutas, false)}
                            className="px-3 py-1.5 bg-red-500/10 text-red-400 text-xs font-medium rounded-lg hover:bg-red-500/20 transition flex items-center gap-1">
                            <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                            Desactivar Mes
                          </button>
                        )}
                      </div>
                    </div>
                    {!isCollapsed && (
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-4">
                      {weekMinutas.map(m => {
                        const d = new Date(m.fecha + 'T12:00:00');
                        const fam = m.familia || 'almuerzo';
                        return (
                          <div key={m.id} className={`rounded-xl border p-4 transition ${m.activo ? 'bg-white/[0.03] border-white/10' : 'bg-white/[0.01] border-white/5 opacity-50'}`}>
                            <div className="flex items-center justify-between mb-2">
                              <div className="flex items-center gap-2">
                                <p className="text-vascan-gold font-semibold">{DAYS[d.getDay()]} {d.getDate()}</p>
                                <span className={`inline-block text-xs font-medium px-2 py-0.5 rounded-full border ${getFamiliaColor(fam, familiasList)}`}>
                                  {getFamiliaLabel(fam, familiasList)}
                                </span>
                              </div>
                              <div className="flex items-center gap-1">
                                <button onClick={() => toggleMinutaActivo(m)} title={m.activo ? 'Desactivar' : 'Activar'}
                                  className={`p-1.5 rounded-lg transition ${m.activo ? 'hover:bg-red-500/10 text-green-400 hover:text-red-400' : 'hover:bg-green-500/10 text-white/30 hover:text-green-400'}`}>
                                  {m.activo
                                    ? <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                                    : <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>
                                  }
                                </button>
                                {user?.role !== 'interlocutor' && (<>
                                  <button onClick={() => openClone(m)} title="Clonar" className="p-1.5 rounded-lg hover:bg-white/10 text-white/40 hover:text-green-400 transition">
                                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
                                  </button>
                                  <button onClick={() => openEdit(m)} title="Editar" className="p-1.5 rounded-lg hover:bg-white/10 text-white/40 hover:text-white transition">
                                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                                  </button>
                                  <button onClick={() => setDeleteTarget(m)} title="Eliminar" className="p-1.5 rounded-lg hover:bg-red-500/10 text-white/40 hover:text-red-400 transition">
                                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                  </button>
                                </>)}
                              </div>
                            </div>
                            <div className="space-y-1.5 text-sm">
                              <div className="flex gap-2"><span className="text-vascan-gold font-semibold min-w-[20px]">1.</span><span className="text-white/70">{m.opcion1}</span></div>
                              <div className="flex gap-2"><span className="text-vascan-gold font-semibold min-w-[20px]">2.</span><span className="text-white/70">{m.opcion2}</span></div>
                              <div className="flex gap-2"><span className="text-vascan-gold font-semibold min-w-[20px]">3.</span><span className="text-white/70">{m.opcion3}</span></div>
                              {m.opcion4 && <div className="flex gap-2"><span className="text-vascan-gold font-semibold min-w-[20px]">4.</span><span className="text-white/70">{m.opcion4}</span></div>}
                              {m.opcion5 && <div className="flex gap-2"><span className="text-vascan-gold font-semibold min-w-[20px]">5.</span><span className="text-white/70">{m.opcion5}</span></div>}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          <Modal open={showModal} onClose={() => setShowModal(false)} title={editItem ? 'Editar Minuta' : 'Nueva Minuta'}>
            <form onSubmit={handleSave} className="space-y-4">
              <InputField label="Fecha" value={form.fecha} onChange={v => setForm({...form, fecha: v})} type="date" required />
              <div>
                <label className="block text-sm font-medium text-white/60 mb-1.5">Familia</label>
                <select value={form.familia} onChange={e => setForm({...form, familia: e.target.value})}
                  className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-vascan-gold/50 transition text-sm" style={{colorScheme: 'dark'}}>
                  {familiasList.map(f => <option key={f.id} value={f.nombre}>{f.nombre}</option>)}
                </select>
              </div>
              <div>
                <div className="flex items-center justify-between mb-1.5">
                  <label className="block text-sm font-medium text-white/60">{editItem ? 'Casinos (replicar cambios a)' : 'Casinos (seleccione uno o más)'}</label>
                  <button type="button" onClick={() => {
                    const allIds = casinos.map(c => c.id);
                    const allSelected = allIds.every(id => form.casinoIds.includes(id));
                    setForm({...form, casinoIds: allSelected ? (editItem ? [editItem.casinoId] : []) : allIds});
                  }} className="text-xs font-medium text-vascan-gold hover:text-vascan-gold/80 transition px-2 py-0.5 rounded-lg bg-vascan-gold/10 hover:bg-vascan-gold/20">
                    {casinos.every(c => form.casinoIds.includes(c.id)) ? 'Ninguno' : 'Todos'}
                  </button>
                </div>
                {editItem && <p className="text-[11px] text-white/40 mb-1.5">El casino actual queda fijo. Los demás recibirán una copia o se actualizarán si ya existe minuta para esa fecha.</p>}
                <div className="space-y-2 max-h-36 overflow-y-auto bg-white/5 rounded-xl p-3 border border-white/10">
                  {casinos.map(c => {
                    const isCurrent = editItem && c.id === editItem.casinoId;
                    return (
                      <label key={c.id} className={`flex items-center gap-3 rounded-lg px-2 py-1.5 transition ${isCurrent ? 'bg-vascan-gold/10' : 'cursor-pointer hover:bg-white/5'}`}>
                        <input type="checkbox" checked={form.casinoIds.includes(c.id)} disabled={isCurrent}
                          onChange={() => setForm({...form, casinoIds: toggleCasinoInList(form.casinoIds, c.id)})}
                          className="w-4 h-4 rounded accent-amber-500" />
                        <span className="text-sm text-white/80">{c.nombre} {isCurrent && <span className="text-[10px] text-vascan-gold ml-1">(actual)</span>}</span>
                      </label>
                    );
                  })}
                </div>
              </div>
              <InputField label="Opción 1" value={form.opcion1} onChange={v => setForm({...form, opcion1: v})} placeholder="Ej: Pollo al horno con arroz" required />
              <InputField label="Opción 2" value={form.opcion2} onChange={v => setForm({...form, opcion2: v})} placeholder="Ej: Pescado frito con puré" required />
              <InputField label="Opción 3" value={form.opcion3} onChange={v => setForm({...form, opcion3: v})} placeholder="Ej: Pasta boloñesa" required />
              <InputField label="Opción 4 (opcional)" value={form.opcion4} onChange={v => setForm({...form, opcion4: v})} placeholder="Ej: Ensalada César" />
              <InputField label="Opción 5 (opcional)" value={form.opcion5} onChange={v => setForm({...form, opcion5: v})} placeholder="Ej: Menú vegetariano" />
              <div className="flex justify-end gap-3 pt-2">
                <button type="button" onClick={() => setShowModal(false)} className="px-5 py-2.5 rounded-xl bg-white/10 hover:bg-white/15 text-sm font-medium transition">Cancelar</button>
                <button type="submit" className="px-5 py-2.5 rounded-xl bg-vascan-gold hover:bg-vascan-goldDark text-sm font-medium transition">
                  {editItem ? 'Guardar Cambios' : 'Crear Minuta'}
                </button>
              </div>
            </form>
          </Modal>

          <Modal open={showCloneModal} onClose={() => setShowCloneModal(false)} title="Clonar Minuta">
            <form onSubmit={handleClone} className="space-y-4">
              {cloneSource && (
                <div className="bg-white/5 rounded-xl p-3 border border-white/10 text-sm">
                  <p className="text-white/60 mb-1">Clonando minuta de: <span className="text-white font-medium">{cloneSource.fecha}</span></p>
                  <p className="text-white/60">Familia: <span className={`inline-block text-xs font-medium px-2 py-0.5 rounded-full border ${getFamiliaColor(cloneSource.familia || 'Almuerzo', familiasList)}`}>{getFamiliaLabel(cloneSource.familia || 'Almuerzo', familiasList)}</span></p>
                </div>
              )}
              <InputField label="Nueva fecha (dejar vacío para mantener)" value={cloneForm.fecha} onChange={v => setCloneForm({...cloneForm, fecha: v})} type="date" />
              <div>
                <div className="flex items-center justify-between mb-1.5">
                  <label className="block text-sm font-medium text-white/60">Casinos destino</label>
                  <button type="button" onClick={() => {
                    const allIds = casinos.map(c => c.id);
                    const allSelected = allIds.every(id => cloneForm.casinoIds.includes(id));
                    setCloneForm({...cloneForm, casinoIds: allSelected ? [] : allIds});
                  }} className="text-xs font-medium text-vascan-gold hover:text-vascan-gold/80 transition px-2 py-0.5 rounded-lg bg-vascan-gold/10 hover:bg-vascan-gold/20">
                    {casinos.every(c => cloneForm.casinoIds.includes(c.id)) ? 'Ninguno' : 'Todos'}
                  </button>
                </div>
                <div className="space-y-2 max-h-36 overflow-y-auto bg-white/5 rounded-xl p-3 border border-white/10">
                  {casinos.map(c => (
                    <label key={c.id} className="flex items-center gap-3 cursor-pointer hover:bg-white/5 rounded-lg px-2 py-1.5 transition">
                      <input type="checkbox" checked={cloneForm.casinoIds.includes(c.id)}
                        onChange={() => setCloneForm({...cloneForm, casinoIds: toggleCasinoInList(cloneForm.casinoIds, c.id)})}
                        className="w-4 h-4 rounded accent-amber-500" />
